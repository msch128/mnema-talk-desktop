[package]
name="mnema-crypto-enrollment-prototype"
version="0.0.0"
edition="2024"
rust-version="1.99"
publish=false
[dependencies]
mnema-crypto-core-prototype={path="../crypto-core"}
mnema-crypto-trust-candidate={path="../crypto-trust"}
mnema-crypto-adapter-candidate={path="../crypto-adapter"}
coset="=0.4.2"
ed25519-dalek={version="=3.0.0",default-features=false,features=["zeroize"]}
zeroize="=1.9.1"
getrandom="=0.4.3"
sha2="=0.11.1"
serde="=1.0.229"
serde_json="=1.0.154"
rusqlite={version="=0.41.0",features=["bundled-sqlcipher-vendored-openssl"]}
openmls={path="../../../vendor/openmls/openmls"}
openmls_traits={path="../../../vendor/openmls/traits"}
openmls_rust_crypto={path="../../../vendor/openmls/openmls_rust_crypto"}
openmls_basic_credential={path="../../../vendor/openmls/basic_credential"}
[target.'cfg(target_os="macos")'.dependencies]
security-framework="=3.7.0"
security-framework-sys="=2.17.0"
core-foundation="=0.10.1"
[dev-dependencies]
tempfile="=3.27.0"
