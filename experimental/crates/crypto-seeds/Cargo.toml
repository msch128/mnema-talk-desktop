[package]
name="mnema-private-native-crypto-seeds"
version="0.0.0"
edition="2024"
publish=false
license="AGPL-3.0-only"
[dependencies]
mnema-private-native-client-broker={path="../broker"}
uuid={version="=1.29.0",features=["v4"]}
sha2="=0.11.1"
zeroize="=1.9.1"
getrandom="=0.4.3"
ed25519-dalek={version="=3.0.0",default-features=false,features=["zeroize"]}
[target.'cfg(windows)'.dependencies]
windows-sys={version="=0.61.2",features=["Win32_Foundation","Win32_Security","Win32_Security_Credentials","Win32_Security_Authorization","Win32_System_Threading"]}
