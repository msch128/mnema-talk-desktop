[package]
name = "openmls_basic_credential"
version = "0.4.1"
authors = ["OpenMLS Authors"]
edition = "2021"
description = "OpenMLS basic credential of the openmls-v0.7.4-migration-helpers line, with RustCrypto p256 0.14 (the upstream branch pins 0.13, which pulls crypto-bigint 0.5)"
license = "MIT"
publish = false

[dependencies]
openmls_traits = { git = "https://github.com/openmls/openmls.git", branch = "openmls-v0.7.4-migration-helpers" }
tls_codec = { version = "0.4.2", features = ["derive", "serde", "mls"] }
serde = "1.0"

# Rust Crypto
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
p256 = { version = "0.14", features = ["getrandom"] }
rand = "0.8"

[features]
clonable = []
test-utils = []
