[package]
name = "mnema-native-client-preview"
version = "1.2.12"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
[features]
default = []
shell = ["dep:tauri", "dep:tauri-build"]
web-client = ["shell", "dep:reqwest", "dep:ed25519-dalek", "dep:sha2", "dep:hex", "dep:base64", "dep:zip", "dep:flate2", "dep:cookie", "dep:tokio-tungstenite", "dep:futures-util", "dep:rustls", "dep:rustls-platform-verifier", "dep:keyring-core", "dep:apple-native-keyring-store", "dep:windows-native-keyring-store", "dep:tauri-plugin-updater", "dep:minisign-verify", "dep:tauri-winrt-notification", "dep:windows", "dep:objc2", "dep:objc2-foundation", "dep:objc2-user-notifications", "dep:block2"]
# Test-only: the app runs two servers side by side against stand-in instances and records the result (src/selftest_multi.rs). Never in a shipped build.
multi-selftest = ["web-client"]
# Test-only: the app posts one toast on its own and records the outcome (src/web_notify/selftest.rs). Never in a shipped build.
notify-selftest = ["web-client"]
# Test-only: the WebView2 startup check sets MNEMA_WEBVIEW_PROBE to read the permission decision (src/web_permissions.rs). Compiled out of every shipped build.
webview-probe = ["web-client"]
custom-protocol = ["shell", "tauri/custom-protocol"]
[dependencies]
reqwest = { version = "=0.13.5", optional = true, default-features = false, features = ["rustls-no-provider", "json"] }
ed25519-dalek = { version = "=3.0.0", optional = true, default-features = false, features = [] }
sha2 = { version = "=0.11.1", optional = true }
hex = { version = "=0.4.3", optional = true }
base64 = { version = "=0.23.1", optional = true }
zip = { version = "=9.1.0", optional = true, default-features = false, features = ["deflate-flate2"] }
# zip selects flate2 without a backend; the pure-Rust one keeps the build free of C.
flate2 = { version = "=1.1.10", optional = true, default-features = false, features = ["rust_backend"] }
cookie = { version = "=0.18.2", optional = true, default-features = false }
tokio-tungstenite = { version = "=0.30.0", optional = true, default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
futures-util = { version = "=0.3.34", optional = true, default-features = false, features = ["sink", "std"] }
# One TLS stack for every connection of the host: rustls speaks TLS 1.2 and 1.3 on every Windows and macOS version (SChannel before Windows 11 and
# Secure Transport have no TLS 1.3), and rustls-platform-verifier keeps the decision on the operating system's own trust store (web_tls.rs).
# The `ring` provider keeps the build free of C.
rustls = { version = "=0.23.46", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = { version = "=0.7.1", optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.29.0", features = ["v4"] }
url = "=2.5.8"
tokio = { version = "=1.54.1", features = ["sync", "time", "rt", "macros"] }
# `unstable`: several webviews in one window (the server rail beside the pages).
tauri = { version = "=2.12.5", optional = true, features = ["unstable"] }
# Signed native self-update. The same rustls stack and platform verifier as the rest of the host (its default provider is installed in web_tls.rs); no system proxy.
# No `zip` feature: it is only for legacy zip-wrapped Windows packages (and pulls a vulnerable zip 4).
tauri-plugin-updater = { version = "=2.14.0", optional = true, default-features = false, features = ["rustls-tls"] }
minisign-verify = { version = "=0.3.0", optional = true }
[target.'cfg(target_os="macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", optional = true, default-features = false, features = ["keychain"] }
objc2={version="=0.6.5",optional=true}
objc2-foundation={version="=0.3.2",optional=true,default-features=false,features=["std","NSArray","NSBundle","NSError","NSString"]}
objc2-user-notifications={version="=0.3.2",optional=true,default-features=false,features=["std","block2","UNNotification","UNNotificationContent","UNNotificationRequest","UNNotificationResponse","UNNotificationSettings","UNNotificationSound","UNNotificationTrigger","UNUserNotificationCenter"]}
block2={version="=0.6.2",optional=true}
[target.'cfg(any(target_os="macos",target_os="windows"))'.dependencies]
keyring-core = { version = "=1.0.1", optional = true }
[dev-dependencies]
# Signs the throwaway test releases; never part of the shipped program.
minisign = "=0.10.0"
tauri = { version = "=2.12.5", features = ["test"] }
tokio = { version = "=1.54.1", features = ["net", "io-util", "rt", "macros"] }
# A local TLS server with a throwaway CA for the protocol-version tests (web_tls.rs); never part of the shipped program.
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem"] }
[target.'cfg(any(target_os="macos",target_os="windows"))'.dev-dependencies]
# keyring 3 wrote the session items of releases up to 0.3.x; a test reads them with the new store.
keyring-v3 = { package = "keyring", version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native"] }
[build-dependencies]
tauri-build = { version = "=2.7.4", optional = true }
[[bin]]
name = "mnema-native-client-preview"
path = "src/main.rs"
required-features = ["shell"]
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", optional = true }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_System_Registry", "Win32_UI_Input", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop"] }
tauri-winrt-notification = { version = "=0.8.1", optional = true }
windows = { version = "=0.62.2", optional = true, default-features = false, features = ["UI_Notifications", "Win32_System_Registry"] }
