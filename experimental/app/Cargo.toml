[package]
name = "mnema-native-client-preview"
version = "0.3.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
[features]
default = []
shell = ["dep:tauri", "dep:tauri-build"]
web-client = ["shell", "dep:reqwest", "dep:ed25519-dalek", "dep:sha2", "dep:hex", "dep:base64", "dep:zip", "dep:flate2", "dep:cookie", "dep:tokio-tungstenite", "dep:futures-util", "dep:native-tls", "dep:keyring", "dep:tauri-plugin-updater", "dep:minisign-verify", "dep:tauri-winrt-notification", "dep:windows", "dep:objc2", "dep:objc2-foundation", "dep:objc2-user-notifications", "dep:block2"]
# Test-only: the app posts one toast on its own and records the outcome (src/web_notify/selftest.rs). Never in a shipped build.
notify-selftest = ["web-client"]
custom-protocol = ["shell", "tauri/custom-protocol"]
synthetic-media-fixture = ["dep:mnema-private-synthetic-media-actor","dep:mnema-private-synthetic-media-policy","tauri/dynamic-acl"]
synthetic-transport-fixture=["mnema-private-native-client-broker/synthetic-transport-fixture","dep:libc"]
native-crypto=["tauri/dynamic-acl","dep:libc","dep:mnema-private-native-crypto-owner","dep:mnema-private-native-trust-dialog","mnema-private-native-trust-dialog/os-modal","dep:mnema-private-native-crypto-seeds","dep:mnema-crypto-enrollment-prototype","dep:getrandom","dep:chrono","dep:security-framework","dep:security-framework-sys","dep:core-foundation"]
[dependencies]
reqwest = { version = "=0.12.28", optional = true, default-features = false, features = ["native-tls", "json"] }
mnema-private-native-crypto-owner={path="../crates/crypto-owner",optional=true,features=["opaque-relay"]}
mnema-private-native-trust-dialog={path="../crates/trust-dialog",optional=true}
mnema-private-native-crypto-seeds={path="../crates/crypto-seeds",optional=true}
mnema-crypto-enrollment-prototype={path="../crates/crypto-stack/crypto-enrollment",optional=true}
zeroize={version="=1.9.1"}
getrandom={version="=0.3.4",optional=true}
chrono={version="=0.4.45",optional=true,default-features=false,features=["clock"]}
mnema-private-synthetic-media-actor={path="../crates/media/rust-actor",optional=true,features=["synthetic-media-fixture"]}
mnema-private-synthetic-media-policy={path="../crates/media/rust",optional=true,features=["synthetic-media-fixture"]}
libc={version="=0.2.190",optional=true}
ed25519-dalek = { version = "=2.2.0", optional = true, default-features = false, features = ["std"] }
sha2 = { version = "=0.10.9", optional = true }
hex = { version = "=0.4.3", optional = true }
base64 = { version = "=0.22.1", optional = true }
zip = { version = "=9.0.4", optional = true, default-features = false, features = ["deflate-flate2"] }
# zip selects flate2 without a backend; the pure-Rust one keeps the build free of C.
flate2 = { version = "=1.1.10", optional = true, default-features = false, features = ["rust_backend"] }
cookie = { version = "=0.18.2", optional = true, default-features = false }
tokio-tungstenite = { version = "=0.30.0", optional = true, default-features = false, features = ["connect", "handshake", "native-tls"] }
futures-util = { version = "=0.3.34", optional = true, default-features = false, features = ["sink", "std"] }
native-tls = { version = "=0.2.18", optional = true }
mnema-private-native-client-broker = { path = "../crates/broker" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.27.0", features = ["v4"] }
url = "=2.5.8"
raw-window-handle = "=0.6.2"
tokio = { version = "=1.53.2", features = ["sync", "time", "rt", "macros"] }
tauri = { version = "=2.12.1", optional = true }
# Signed native self-update. The system TLS stack like the rest of the host; no system proxy.
# No `zip` feature: it is only for legacy zip-wrapped Windows packages (and pulls a vulnerable zip 4).
tauri-plugin-updater = { version = "=2.13.3", optional = true, default-features = false, features = ["native-tls"] }
minisign-verify = { version = "=0.3.0", optional = true }
[target.'cfg(target_os="macos")'.dependencies]
security-framework={version="=3.7.0",optional=true}
security-framework-sys={version="=2.17.0",optional=true}
core-foundation={version="=0.10.1",optional=true}
objc2={version="=0.6.5",optional=true}
objc2-foundation={version="=0.3.2",optional=true,default-features=false,features=["std","NSBundle","NSError","NSString"]}
objc2-user-notifications={version="=0.3.2",optional=true,default-features=false,features=["std","block2","UNNotification","UNNotificationContent","UNNotificationRequest","UNNotificationResponse","UNNotificationSettings","UNNotificationSound","UNNotificationTrigger","UNUserNotificationCenter"]}
block2={version="=0.6.2",optional=true}
[target.'cfg(any(target_os="macos",target_os="windows"))'.dependencies]
keyring = { version = "=3.6.3", optional = true, default-features = false, features = ["apple-native", "windows-native"] }
[dev-dependencies]
# Signs the throwaway test releases; never part of the shipped program.
minisign = "=0.9.1"
tauri = { version = "=2.12.1", features = ["test"] }
tokio = { version = "=1.53.2", features = ["net", "io-util", "rt", "macros"] }
[target.'cfg(unix)'.dev-dependencies]
libc = "=0.2.190"
[build-dependencies]
tauri-build = { version = "=2.7.1", optional = true }
[[bin]]
name = "mnema-native-client-preview"
path = "src/main.rs"
required-features = ["shell"]
[[example]]
name = "metadata_fixture"
path = "examples/metadata_fixture.rs"
required-features = ["synthetic-transport-fixture"]

# Reviewed GTK3-compatible RUSTSEC-2024-0429 backport; see scripts/checked-glib.mjs.
[patch.crates-io]
glib = { path = "../vendor/glib" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse"] }
tauri-winrt-notification = { version = "=0.8.1", optional = true }
windows = { version = "=0.62.2", optional = true, default-features = false, features = ["UI_Notifications", "Win32_System_Registry"] }
