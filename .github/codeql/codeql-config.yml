name: "CodeQL config"

paths-ignore:
  # Dependencies
  - 'node_modules'
  - '**/node_modules/**'
  # Generated distribution and build output
  - 'dist'
  - '**/dist/**'
  - 'build'
  - '**/build/**'
  - 'target'
  - '**/target/**'
  - 'linux/dist/**'
  - 'linux/release/**'
  - 'linux/bundle/**'
  - 'experimental/app/bundle/**'
