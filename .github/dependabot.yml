# Weekly dependency updates, one PR per ecosystem and directory. Security
# updates are opened immediately regardless of this schedule. Version updates
# wait 5 days after a release (cooldown) so a hijacked or yanked version is
# usually caught before it reaches a PR. Lockfiles keep their integrity hashes;
# actions stay pinned by commit SHA (Dependabot rewrites the SHA and comment).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 5 }
    open-pull-requests-limit: 3
    commit-message: { prefix: "build(deps)" }
    groups:
      cargo-host: { patterns: ["*"] }

  - package-ecosystem: cargo
    directory: /experimental/app
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 5 }
    open-pull-requests-limit: 3
    commit-message: { prefix: "build(deps)" }
    groups:
      cargo-app: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /ui
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 5 }
    open-pull-requests-limit: 3
    commit-message: { prefix: "build(deps)", prefix-development: "build(deps-dev)" }
    groups:
      npm-ui-runtime: { dependency-type: production }
      npm-ui-dev: { dependency-type: development }

  - package-ecosystem: npm
    directory: /linux
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 5 }
    open-pull-requests-limit: 3
    commit-message: { prefix: "build(deps)", prefix-development: "build(deps-dev)" }
    groups:
      npm-linux-runtime: { dependency-type: production }
      npm-linux-dev: { dependency-type: development }

  - package-ecosystem: npm
    directory: /experimental/ui
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 5 }
    open-pull-requests-limit: 3
    commit-message: { prefix: "build(deps)", prefix-development: "build(deps-dev)" }
    groups:
      npm-native-ui-runtime: { dependency-type: production }
      npm-native-ui-dev: { dependency-type: development }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "ci(deps)" }
    groups:
      actions: { patterns: ["*"] }
