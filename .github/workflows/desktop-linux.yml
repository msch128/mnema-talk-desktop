name: Linux client

# The Electron client for Linux (linux/): the same signed web app and the same
# verification as the Tauri host, ported to TypeScript and checked against the
# vectors in test-vectors/. Tauri's WebKitGTK has no WebRTC on Linux, so this
# platform runs Chromium; Windows and macOS stay on Tauri.
#
# On every change: lint, types, the shared vectors, unit tests, an end-to-end
# run of the development app, and an end-to-end run of the packaged app, on
# x86_64 and arm64. For a release (desktop-release.yml) it also builds the
# AppImage and the .deb; signing the AppImage for the updater happens there,
# in the protected environment.
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      tag:
        required: true
        type: string
  workflow_dispatch:
  pull_request:
    paths:
      - linux/**
      - test-vectors/**
      - icons/**
      - scripts/**
      - experimental/app/fixtures/**
      - experimental/app/rail-ui/**
      - experimental/app/tauri.conf.json
      - .github/workflows/desktop-linux.yml
  push:
    branches: [main, 'codex/**']
    paths:
      - linux/**
      - test-vectors/**
      - icons/**
      - scripts/**
      - experimental/app/fixtures/**
      - experimental/app/rail-ui/**
      - experimental/app/tauri.conf.json
      - .github/workflows/desktop-linux.yml

permissions:
  contents: read

env:
  # The mnema-talk release the real-server job builds and runs, by tag and by
  # the commit that tag names; the same pin as in desktop-client.yml.
  REAL_SERVER_TAG: v3.0.12
  REAL_SERVER_REV: 7a513234eb3035233f05f4bfa46272826310f3ad
  # SeaweedFS (the server's object storage) as a release binary, with its digest.
  SEAWEEDFS_VERSION: '4.52'
  # The last release named "Mnema Desktop DEV": its installed copies must update in place.
  LAST_DEV_VERSION: '1.3.5'

concurrency:
  group: linux-client-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            unpacked: linux-unpacked
            deb_arch: amd64
            appimage_arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            unpacked: linux-arm64-unpacked
            deb_arch: arm64
            appimage_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: linux/package-lock.json
      # Dependencies are installed without install scripts; the only one that
      # is needed, Electron's download of its binary, runs explicitly.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/electron/install.js
      - name: Shipped dependencies have no known high advisory
        run: npm audit --omit=dev --audit-level=high
      - name: Lint and types
        run: |
          npm run lint
          npm run typecheck
      - name: Shared vectors are current, unit tests
        run: |
          npm run vectors:check
          npm test
      # The web app runs from a signed bundle. The build embeds the one attached
      # to the newest mnema-talk release that has one; the client verifies it
      # with the key pinned in its source, so a bundle from anywhere else is useless.
      - name: Stage the signed web bundle
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUNDLE_DIR: linux/bundle
        run: bash scripts/stage-web-bundle.sh
      - name: Build
        run: npm run build
      - name: System packages for a headless display
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb x11-utils libasound2t64 dunst dbus dbus-bin
          # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's sandbox uses.
          # The .deb brings an AppArmor profile for that; the development binary does not.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: End to end, development app
        if: hashFiles('linux/bundle/builtin.zip') != ''
        run: xvfb-run -a npm run e2e
      - name: Package (unpacked, AppImage, .deb)
        run: npx electron-builder --linux dir AppImage deb --${{ matrix.arch }} --publish never
      - name: End to end, packaged app
        if: hashFiles('linux/bundle/builtin.zip') != ''
        env:
          MNEMA_E2E_APP: ${{ github.workspace }}/linux/release/${{ matrix.unpacked }}/mnema-desktop-dev
        run: xvfb-run -a node --test --test-timeout=120000 "test/e2e/*.e2e.ts"
      # A real notification daemon (dunst) on a private session bus: the toast
      # the page asks for must arrive at org.freedesktop.Notifications.Notify
      # (seen with dbus-monitor), and using it must come back to the page as
      # the click of that message.
      - name: Notifications, packaged app against a real notification daemon
        if: hashFiles('linux/bundle/builtin.zip') != ''
        env:
          MNEMA_E2E_APP: ${{ github.workspace }}/linux/release/${{ matrix.unpacked }}/mnema-desktop-dev
        run: bash scripts/notify-e2e.sh
      - name: The packaged app refuses to start unsandboxed and with a debugging port
        env:
          APP: ${{ github.workspace }}/linux/release/${{ matrix.unpacked }}/mnema-desktop-dev
          MNEMA_DESKTOP_DATA_DIR: ${{ runner.temp }}/refuse
        run: |
          set -eu
          xvfb-run -a bash scripts/refuse.sh 'browser sandbox is turned off' "$APP" --no-sandbox
          xvfb-run -a bash scripts/refuse.sh 'does not open a remote debugging port' "$APP" --remote-debugging-port=0
      # Up to 1.3.5 the client was called "Mnema Desktop DEV". An installed .deb
      # of that release must be upgraded in place by this build's (the same
      # package), and its AppImage replaced where it lies must start.
      - name: The .deb and the AppImage of the last release named DEV upgrade in place
        if: hashFiles('linux/bundle/builtin.zip') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MNEMA_DEBUG_PROTOCOL: '1'
          MNEMA_DESKTOP_NO_UPDATE_CHECK: '1'
          MNEMA_DESKTOP_NO_VAULT: '1'
          MNEMA_DESKTOP_DATA_DIR: ${{ runner.temp }}/upgrade
        run: bash scripts/upgrade-from-dev.sh "$LAST_DEV_VERSION" ${{ matrix.deb_arch }} ${{ matrix.appimage_arch }}
      - name: The AppImage and the installed .deb start and show the instance selector
        if: hashFiles('linux/bundle/builtin.zip') != ''
        env:
          MNEMA_DEBUG_PROTOCOL: '1'
          MNEMA_DESKTOP_NO_UPDATE_CHECK: '1'
          MNEMA_DESKTOP_NO_VAULT: '1'
          MNEMA_DESKTOP_DATA_DIR: ${{ runner.temp }}/smoke
        run: |
          set -eu
          xvfb-run -a bash scripts/smoke.sh env APPIMAGE_EXTRACT_AND_RUN=1 "$(ls release/*.AppImage)"
          sudo apt-get install -y ./release/*.deb
          # The package installs its AppArmor profile where AppArmor is active.
          if apparmor_status --enabled >/dev/null 2>&1; then
            test -f /etc/apparmor.d/mnema-desktop-dev || { echo '::error::the AppArmor profile is not installed'; exit 1; }
          fi
          xvfb-run -a bash scripts/smoke.sh "/opt/Mnema Desktop/mnema-desktop-dev"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.tag != ''
        with:
          name: mnema-desktop-linux-${{ matrix.arch }}
          path: |
            linux/release/*.AppImage
            linux/release/*.deb
          if-no-files-found: error
          retention-days: 1

  # The Electron client against a REAL mnema-talk server instead of stand-ins:
  # the Go binary is built from the pinned release and listens on port 18443,
  # PostgreSQL runs in Docker and SeaweedFS as a local process.
  # scripts/real-server-selftest.mjs (--run) starts the server and restarts it
  # on request, and linux/test/e2e/real/server.e2e.ts drives the client: it adds
  # http://localhost:18443, runs the signed bundle, signs in, opens the
  # WebSocket, sends a message and sees it pushed, and follows the restart.
  # No microphone, camera or audio is involved.
  linux-real-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: msch128/mnema-talk
          ref: ${{ env.REAL_SERVER_REV }}
          path: server
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: linux/package-lock.json
      - name: Install dependencies and build the client
        working-directory: linux
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/electron/install.js
          npm run build
      - name: Stage the signed web bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUNDLE_DIR: linux/bundle
        run: bash scripts/stage-web-bundle.sh
      - name: Build the server from the pinned release
        working-directory: server
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$REAL_SERVER_REV" ] || { echo '::error::the server checkout is not the pinned revision'; exit 1; }
          CGO_ENABLED=0 go build -trimpath -ldflags "-X github.com/msch128/mnema-talk/internal/version.Version=${REAL_SERVER_TAG#v}" -o "$RUNNER_TEMP/mnema-server" ./cmd/server
      - name: Fetch SeaweedFS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          digest=8b538c22d47d0c3fb6792adaa6b0c735a967401270a53427d5a476dcaca9b7ae
          gh release download "$SEAWEEDFS_VERSION" --repo seaweedfs/seaweedfs --pattern linux_amd64.tar.gz --dir "$RUNNER_TEMP/weed-download"
          [ "$(sha256sum "$RUNNER_TEMP/weed-download/linux_amd64.tar.gz" | cut -d' ' -f1)" = "$digest" ] || { echo '::error::SeaweedFS archive digest mismatch'; exit 1; }
          mkdir "$RUNNER_TEMP/weed"
          tar -xzf "$RUNNER_TEMP/weed-download/linux_amd64.tar.gz" -C "$RUNNER_TEMP/weed"
          echo "WEED_EXE=$RUNNER_TEMP/weed/weed" >> "$GITHUB_ENV"
      - name: Start PostgreSQL
        run: |
          set -euo pipefail
          docker run -d --name mnema-pg -e POSTGRES_USER=mnema -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=mnema_selftest -p 127.0.0.1:55432:5432 postgres:18-alpine
          for _ in $(seq 1 60); do docker exec mnema-pg pg_isready -U mnema -d mnema_selftest && break; sleep 1; done
          docker exec mnema-pg pg_isready -U mnema -d mnema_selftest
          echo 'DATABASE_URL=postgres://mnema@127.0.0.1:55432/mnema_selftest?sslmode=disable' >> "$GITHUB_ENV"
      - name: System packages for a headless display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb x11-utils libasound2t64
          # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's sandbox uses.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: The client against a real server, through a restart of it
        if: hashFiles('linux/bundle/builtin.zip') != ''
        run: node scripts/real-server-selftest.mjs --run "$RUNNER_TEMP/mnema-server" xvfb-run -a node --test --test-timeout=300000 linux/test/e2e/real/server.e2e.ts
