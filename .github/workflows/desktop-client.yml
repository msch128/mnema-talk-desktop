name: Shared desktop client DEV builds

on:
  workflow_call:
    outputs:
      revision:
        description: Source revision that was built
        value: ${{ jobs.windows-client.outputs.revision }}
      macos-revision:
        description: Source revision that the macOS executable was built from
        value: ${{ jobs.macos-client.outputs.revision }}
    inputs:
      ref:
        required: true
        type: string
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      acceptance_release:
        description: 'Optional mnema-talk release tag through v0.7.3 to test instead of building'
        required: false
        type: string
      acceptance_instance:
        description: 'Public HTTPS origin for unauthenticated release acceptance'
        required: false
        type: string
      acceptance_fixture:
        description: 'Use an isolated local normal-backend fixture for login/chat/logout'
        required: false
        default: false
        type: boolean
      acceptance_voice:
        description: 'Extend the owned fixture with SFU microphone RTP and voice controls (synthetic input)'
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - experimental/**
      - icons/**
      - scripts/**
      - ui/**
      - src/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/desktop-client.yml
  push:
    branches: [main, 'codex/**']
    paths:
      - experimental/**
      - icons/**
      - scripts/**
      - ui/**
      - src/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/desktop-client.yml

permissions:
  contents: read

concurrency:
  group: shared-desktop-${{ inputs.acceptance_release && format('{0}-{1}', inputs.acceptance_release, github.sha) || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  windows-client:
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      revision: ${{ steps.source.outputs.sha }}
    env:
      RUST_VERSION: 1.99.0
      CARGO_TARGET_DIR: ${{ github.workspace }}/experimental/app/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      # The Vue app stays in mnema-talk. This host only embeds its built dist
      # and then loads the selected instance. Default ref is that repo's main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: msch128/mnema-talk
          ref: ${{ inputs.acceptance_release || 'main' }}
          path: mnema-talk
          persist-credentials: false
      - name: Capture actual source revision
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: inputs.acceptance_fixture
        with:
          go-version-file: mnema-talk/go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: inputs.acceptance_fixture
        with:
          node-version: 26
      - name: Build released canonical web assets for the normal backend fixture
        if: inputs.acceptance_fixture
        working-directory: mnema-talk/web
        shell: powershell
        env:
          ACCEPTANCE_RELEASE: ${{ inputs.acceptance_release }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:ACCEPTANCE_RELEASE -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'An existing release tag is required' }
          $env:MNEMA_VERSION = $env:ACCEPTANCE_RELEASE.Substring(1)
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Fixture web dependencies failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Fixture web build failed' }
      - name: Test the published Windows release against an actual instance
        timeout-minutes: 15
        # This dispatch-only setup uses the unchanged released web/backend tree.
        # Generated credentials, certificates and database files stay in runner.temp.
        if: inputs.acceptance_release != ''
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_RELEASE: ${{ inputs.acceptance_release }}
          ACCEPTANCE_INSTANCE: ${{ inputs.acceptance_instance }}
          ACCEPTANCE_FIXTURE: ${{ inputs.acceptance_fixture }}
          ACCEPTANCE_VOICE: ${{ inputs.acceptance_voice }}
        working-directory: mnema-talk
        run: |
          if ($env:ACCEPTANCE_VOICE -eq 'true' -and $env:ACCEPTANCE_FIXTURE -ne 'true') { throw 'Voice acceptance requires the owned fixture' }
          if ($env:ACCEPTANCE_FIXTURE -eq 'true') {
            ../scripts/test-windows-auth-fixture.ps1 -Tag $env:ACCEPTANCE_RELEASE -VoiceAcceptance:($env:ACCEPTANCE_VOICE -eq 'true')
          } else {
            ../scripts/test-windows-release.ps1 -Tag $env:ACCEPTANCE_RELEASE -InstanceUrl $env:ACCEPTANCE_INSTANCE
          }
      - name: Upload bounded Windows acceptance result
        if: inputs.acceptance_release != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-published-release-acceptance
          path: |
            ${{ runner.temp }}/windows-release-acceptance/ACCEPTANCE.json
            ${{ runner.temp }}/windows-release-acceptance/SERVER-RESULT.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: inputs.acceptance_release == ''
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mnema-talk/web/package-lock.json
      - name: Select pinned Rust toolchain
        if: inputs.acceptance_release == ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install $env:RUST_VERSION --profile minimal --component clippy --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default $env:RUST_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed' }
      - name: Check and build the canonical Vue client
        if: inputs.acceptance_release == ''
        working-directory: mnema-talk/web
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Web dependencies failed' }
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw 'Web lint failed' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Web typecheck failed' }
          npm run test -- --run
          if ($LASTEXITCODE -ne 0) { throw 'Web tests failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Web build failed' }
      # The web app runs from a signed bundle (mnema-talk
      # doc/desktop-trusted-client.md). The build embeds the one attached to
      # the newest mnema-talk release that has one; the host verifies it with
      # the key pinned in its source, so a bundle from anywhere else is useless.
      - name: Stage the signed web bundle
        if: inputs.acceptance_release == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash scripts/stage-web-bundle.sh

      - name: Check and link the canonical protected native host on Windows
        if: inputs.acceptance_release == ''
        shell: pwsh
        run: |
          node scripts/checked-glib.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed dependency source verification failed' }
          cargo test --locked --manifest-path experimental/crates/crypto-owner/qualified-sdk/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Protected SDK tests failed' }
          cargo test --locked --manifest-path experimental/crates/crypto-owner/Cargo.toml --features opaque-relay
          if ($LASTEXITCODE -ne 0) { throw 'Protected chat-owner tests failed' }
          cargo build --locked --release --manifest-path experimental/app/Cargo.toml --features shell,native-crypto,custom-protocol
          if ($LASTEXITCODE -ne 0) { throw 'Protected native host link failed' }
      - name: Check and link the actual shared-client Tauri host
        if: inputs.acceptance_release == ''
        shell: pwsh
        env:
          # A release build must embed a bundle; the test checks that the pinned key verifies it.
          MNEMA_REQUIRE_BUNDLE: ${{ inputs.tag != '' && '1' || '' }}
          MNEMA_TEST_BUNDLE_ZIP: ${{ github.workspace }}/experimental/app/bundle/builtin.zip
        run: |
          node scripts/checked-glib.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed dependency source verification failed' }
          cargo test --locked --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol
          if ($LASTEXITCODE -ne 0) { throw 'Shared host tests failed' }
          cargo clippy --locked --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Shared host Clippy failed' }
          cargo build --locked --release --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol
          if ($LASTEXITCODE -ne 0) { throw 'Shared Windows executable build failed' }
          if (!(Test-Path 'experimental/app/target/release/mnema-native-client-preview.exe')) { throw 'Shared executable missing' }
          'Unsigned DEV web-client host linked from experimental/app with embedded web/dist. This job does not qualify GUI, multi-device E2EE, voice, games, fullscreen overlays or distribution licenses. The installer of a release updates itself; this portable executable does not.' | Out-File -Append $env:GITHUB_STEP_SUMMARY
      - name: Prepare unsigned Windows DEV artifact
        if: inputs.acceptance_release == ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devOutput = Join-Path $env:RUNNER_TEMP 'mnema-desktop-windows-dev'
          New-Item -ItemType Directory -Path $devOutput -Force | Out-Null
          $devExe = Join-Path $devOutput 'Mnema Desktop DEV.exe'
          Copy-Item 'experimental/app/target/release/mnema-native-client-preview.exe' $devExe
          $process = Start-Process -FilePath $devExe -PassThru
          try {
            $windowReady = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw "Desktop exited before opening its window: $($process.ExitCode)" }
              if ($process.MainWindowHandle -ne 0 -and $process.MainWindowTitle -eq 'Mnema Desktop DEV — Instance') { $windowReady = $true; break }
            }
            if (!$windowReady) { throw 'Desktop selector window did not appear' }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          Copy-Item 'experimental/licenses'  (Join-Path $devOutput 'licenses') -Recurse
          Copy-Item 'LICENSE' $devOutput
          Copy-Item 'mnema-talk/THIRD_PARTY_NOTICES.md' $devOutput
          Copy-Item 'experimental/THIRD_PARTY_NOTICES.md' (Join-Path $devOutput 'NATIVE_THIRD_PARTY_NOTICES.md')
          Copy-Item 'experimental/README.md' (Join-Path $devOutput 'SOURCE_STATUS.md')
          $devReceipt = [ordered]@{
            kind = 'unsigned-development-web-desktop-client'
            revision = '${{ steps.source.outputs.sha }}'
            target = 'x86_64-pc-windows-msvc'
            executable = 'Mnema Desktop DEV.exe'
            executable_sha256 = (Get-FileHash -Algorithm SHA256 $devExe).Hash.ToLowerInvariant()
            shared_frontend = 'web/src'
            instance_transport = 'verified-bundle-native-proxy'
            windows_startup_checked = $true
            synthetic_fixture_features = $false
            windows_gui_qualified = $false
            multi_device_e2ee_qualified = $false
            restored_history_qualified = $false
            native_voice_qualified = $false
            real_games_qualified = $false
            distribution_license_closure_complete = $false
            web_app = 'signed-bundle-verified-by-pinned-key'
            signed = $false
            automatic_updater_package = $false
          }
          $devReceipt | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $devOutput 'DEV-BUILD.json')
          @'
          Mnema Desktop DEV — unsigned development build

          This is the canonical Mnema Vue client in the experimental Tauri host.
          The web app runs from a signed bundle that the client verifies against a
          key pinned in the executable; the instance supplies data, never code.
          Enter the HTTPS address of a compatible normal Mnema instance.

          Windows GUI, multi-device E2EE, restored history, native voice and game
          overlays have not been fully qualified. Voice, camera and screen sharing
          use the WebView browser APIs and still need device testing. This portable ZIP does not update itself; the installer of a release does.

          Check DEV-BUILD.json for the source revision and executable SHA-256.
          Source and dependency notices accompany this build. The existing prebuilt
          DeepFilterNet WASM still has an incomplete transitive provenance inventory;
          this build does not claim final distribution-license qualification.
          '@ | Set-Content -Encoding utf8 (Join-Path $devOutput 'README-DEV.txt')
      - name: Upload explicitly unsigned Windows DEV artifact
        if: inputs.acceptance_release == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mnema-desktop-windows-DEV-UNSIGNED-${{ steps.source.outputs.sha }}
          path: ${{ runner.temp }}/mnema-desktop-windows-dev/
          if-no-files-found: error
          retention-days: 7
      # A release (desktop-release.yml) turns this tested executable into the
      # signed installer; nothing is rebuilt after the tests.
      - name: Upload the tested executable for the installer
        if: inputs.tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mnema-desktop-windows-exe-${{ steps.source.outputs.sha }}
          path: experimental/app/target/release/mnema-native-client-preview.exe
          if-no-files-found: error
          retention-days: 1

  # The same host on macOS: unit tests and Clippy on every change, and for a
  # release the universal (arm64 + x86_64) executable that desktop-release.yml
  # turns into the app bundle. The macOS build has no gaming overlay (the
  # Windows-only parts are compiled out) and is ad-hoc signed, not notarized.
  macos-client:
    if: inputs.acceptance_release == ''
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      revision: ${{ steps.source.outputs.sha }}
    env:
      RUST_VERSION: 1.99.0
      CARGO_TARGET_DIR: ${{ github.workspace }}/experimental/app/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Capture actual source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default "$RUST_VERSION"
      - name: Stage the signed web bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash scripts/stage-web-bundle.sh
      - name: Test and lint the shared-client host for macOS
        env:
          # A release build must embed a bundle; the test checks that the pinned key verifies it.
          MNEMA_REQUIRE_BUNDLE: ${{ inputs.tag != '' && '1' || '' }}
          MNEMA_TEST_BUNDLE_ZIP: ${{ github.workspace }}/experimental/app/bundle/builtin.zip
        run: |
          node scripts/checked-glib.mjs
          cargo test --locked --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol
          cargo clippy --locked --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol --all-targets -- -D warnings
      # A release (desktop-release.yml) bundles this tested executable; nothing
      # is rebuilt after the tests.
      - name: Build the universal executable
        if: inputs.tag != ''
        env:
          MNEMA_REQUIRE_BUNDLE: '1'
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --locked --release --target "$target" --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol
          done
          out="$CARGO_TARGET_DIR/universal-apple-darwin/release"
          mkdir -p "$out"
          lipo -create -output "$out/mnema-native-client-preview" \
            "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/mnema-native-client-preview" \
            "$CARGO_TARGET_DIR/x86_64-apple-darwin/release/mnema-native-client-preview"
          archs="$(lipo -archs "$out/mnema-native-client-preview")"
          echo "Architectures: $archs"
          case " $archs " in *" arm64 "*" x86_64 "* | *" x86_64 "*" arm64 "*) ;; *) echo '::error::the executable is not universal'; exit 1 ;; esac
          echo 'Unsigned universal macOS host linked from experimental/app with the signed web bundle embedded. The release workflow ad-hoc signs it; it is not notarized.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the tested executable for the app bundle
        if: inputs.tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mnema-desktop-macos-exe-${{ steps.source.outputs.sha }}
          path: experimental/app/target/universal-apple-darwin/release/mnema-native-client-preview
          if-no-files-found: error
          retention-days: 1
