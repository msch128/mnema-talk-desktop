name: Shared desktop client DEV builds

on:
  workflow_call:
    outputs:
      revision:
        description: Source revision that was built
        value: ${{ jobs.windows-client.outputs.revision }}
      macos-revision:
        description: Source revision that the macOS executable was built from
        value: ${{ jobs.macos-client.outputs.revision }}
    inputs:
      ref:
        required: true
        type: string
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      acceptance_release:
        description: 'Optional mnema-talk release tag through v0.7.3 to test instead of building'
        required: false
        type: string
      acceptance_instance:
        description: 'Public HTTPS origin for unauthenticated release acceptance'
        required: false
        type: string
      acceptance_fixture:
        description: 'Use an isolated local normal-backend fixture for login/chat/logout'
        required: false
        default: false
        type: boolean
      acceptance_voice:
        description: 'Extend the owned fixture with SFU microphone RTP and voice controls (synthetic input)'
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - experimental/**
      - icons/**
      - scripts/**
      - test-vectors/**
      - ui/**
      - src/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/desktop-client.yml
  push:
    branches: [main, 'codex/**']
    paths:
      - experimental/**
      - icons/**
      - scripts/**
      - test-vectors/**
      - ui/**
      - src/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/desktop-client.yml

permissions:
  contents: read

env:
  # The published desktop release whose signed packages feed the signature tests.
  FIXTURE_VERSION: 0.3.1
  # The mnema-talk release the real-server jobs build and run, by tag and by the
  # commit that tag names. Move both together when a newer release is wanted,
  # and in desktop-linux.yml too (scripts/real-server-pins.test.mjs checks it).
  REAL_SERVER_TAG: v3.0.12
  REAL_SERVER_REV: 7a513234eb3035233f05f4bfa46272826310f3ad
  # SeaweedFS (the server's object storage) as a release binary, with its digest.
  SEAWEEDFS_VERSION: '4.52'
  # The last release named "Mnema Desktop DEV": its installed copies must update in place.
  LAST_DEV_VERSION: '1.3.5'

concurrency:
  group: shared-desktop-${{ inputs.acceptance_release && format('{0}-{1}', inputs.acceptance_release, github.sha) || inputs.tag || github.ref }}
  # Superseded pull request runs are cancelled; tag, push and acceptance runs never are.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-client:
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      revision: ${{ steps.source.outputs.sha }}
    env:
      RUST_VERSION: 1.99.1
      CARGO_TARGET_DIR: ${{ github.workspace }}/experimental/app/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      # The Vue app stays in mnema-talk and reaches this host as a signed
      # bundle (see "Stage the signed web bundle"). The checkout supplies the
      # notices shipped next to the portable executable. Default ref is that
      # repo's main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mnema-xyz/talk
          ref: ${{ inputs.acceptance_release || 'main' }}
          path: mnema-talk
          persist-credentials: false
      - name: Capture actual source revision
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: inputs.acceptance_fixture
        with:
          go-version-file: mnema-talk/go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.acceptance_fixture
        with:
          node-version: 26
      - name: Build released canonical web assets for the normal backend fixture
        if: inputs.acceptance_fixture
        working-directory: mnema-talk/web
        shell: powershell
        env:
          ACCEPTANCE_RELEASE: ${{ inputs.acceptance_release }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:ACCEPTANCE_RELEASE -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'An existing release tag is required' }
          $env:MNEMA_VERSION = $env:ACCEPTANCE_RELEASE.Substring(1)
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Fixture web dependencies failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Fixture web build failed' }
      - name: Test the published Windows release against an actual instance
        timeout-minutes: 15
        # This dispatch-only setup uses the unchanged released web/backend tree.
        # Generated credentials, certificates and database files stay in runner.temp.
        if: inputs.acceptance_release != ''
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_RELEASE: ${{ inputs.acceptance_release }}
          ACCEPTANCE_INSTANCE: ${{ inputs.acceptance_instance }}
          ACCEPTANCE_FIXTURE: ${{ inputs.acceptance_fixture }}
          ACCEPTANCE_VOICE: ${{ inputs.acceptance_voice }}
        working-directory: mnema-talk
        run: |
          if ($env:ACCEPTANCE_VOICE -eq 'true' -and $env:ACCEPTANCE_FIXTURE -ne 'true') { throw 'Voice acceptance requires the owned fixture' }
          if ($env:ACCEPTANCE_FIXTURE -eq 'true') {
            ../scripts/test-windows-auth-fixture.ps1 -Tag $env:ACCEPTANCE_RELEASE -VoiceAcceptance:($env:ACCEPTANCE_VOICE -eq 'true')
          } else {
            ../scripts/test-windows-release.ps1 -Tag $env:ACCEPTANCE_RELEASE -InstanceUrl $env:ACCEPTANCE_INSTANCE
          }
      - name: Upload bounded Windows acceptance result
        if: inputs.acceptance_release != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-published-release-acceptance
          path: |
            ${{ runner.temp }}/windows-release-acceptance/ACCEPTANCE.json
            ${{ runner.temp }}/windows-release-acceptance/SERVER-RESULT.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.acceptance_release == ''
        with:
          node-version: 26
      - name: Select pinned Rust toolchain
        if: inputs.acceptance_release == ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install $env:RUST_VERSION --profile minimal --component clippy --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default $env:RUST_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed' }
      # Restored on pull requests, saved only on main.
      - if: inputs.acceptance_release == ''
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: experimental/app -> target
          key: ${{ hashFiles('**/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The web app runs from a signed bundle (mnema-talk
      # doc/desktop-trusted-client.md). The build embeds the one attached to
      # the newest mnema-talk release that has one; the host verifies it with
      # the key pinned in its source, so a bundle from anywhere else is useless.
      - name: Stage the signed web bundle
        if: inputs.acceptance_release == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash scripts/stage-web-bundle.sh

      # A real package from a published release, signed by the release pipeline:
      # the host's signature check runs on it, not only on packages the tests sign.
      - name: Fetch a signed release package for the signature tests
        if: inputs.acceptance_release == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v$FIXTURE_VERSION" --repo "$GITHUB_REPOSITORY" --dir signed-package --pattern "Mnema-Desktop-DEV_${FIXTURE_VERSION}_x64-setup.exe*"
      - name: Check and link the actual shared-client Tauri host
        if: inputs.acceptance_release == ''
        shell: pwsh
        env:
          # A release build must embed a bundle; the test checks that the pinned key verifies it.
          MNEMA_REQUIRE_BUNDLE: ${{ inputs.tag != '' && '1' || '' }}
          MNEMA_TEST_BUNDLE_ZIP: ${{ github.workspace }}/experimental/app/bundle/builtin.zip
          MNEMA_TEST_UPDATE_PACKAGE: ${{ github.workspace }}/signed-package/Mnema-Desktop-DEV_${{ env.FIXTURE_VERSION }}_x64-setup.exe
          MNEMA_TEST_UPDATE_VERSION: ${{ env.FIXTURE_VERSION }}
          # Items written by keyring 3 (releases up to 0.3.x) stay readable (web_vault.rs).
          MNEMA_KEYRING_COMPAT: '1'
        run: |
          cargo test --locked --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol
          if ($LASTEXITCODE -ne 0) { throw 'Shared host tests failed' }
          # Servers that offer only TLS 1.3, only TLS 1.2 (local, test CA): the host's own stack, not the system's, must reach both.
          cargo test --locked --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol tls_1_
          if ($LASTEXITCODE -ne 0) { throw 'TLS version tests failed' }
          cargo test --locked --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol public_https -- --ignored
          if ($LASTEXITCODE -ne 0) { throw 'Public HTTPS reachability failed' }
          cargo clippy --locked --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Shared host Clippy failed' }
          # The test-only features are linted too: they are code that CI builds and runs.
          cargo clippy --locked --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol,multi-selftest,gaming-selftest,notify-selftest,webview-probe --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Shared host Clippy with the test-only features failed' }
          cargo build --locked --release --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol
          if ($LASTEXITCODE -ne 0) { throw 'Shared Windows executable build failed' }
          if (!(Test-Path 'experimental/app/target/release/mnema-native-client-preview.exe')) { throw 'Shared executable missing' }
          'Unsigned web-client host linked from experimental/app with the embedded signed web bundle. The next step checks the WebView2 origin and the media-permission decision with a synthetic capture device. It does not click a prompt and does not qualify a physical device, sealed media, multi-device E2EE, real games, fullscreen overlays or distribution licenses. The installer and the portable ZIP of a release update themselves; this bare executable does not.' | Out-File -Append $env:GITHUB_STEP_SUMMARY
      - name: Prepare the unsigned portable Windows artifact
        if: inputs.acceptance_release == ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devOutput = Join-Path $env:RUNNER_TEMP 'mnema-desktop-windows-dev'
          New-Item -ItemType Directory -Path $devOutput -Force | Out-Null
          $devExe = Join-Path $devOutput 'Mnema Desktop.exe'
          Copy-Item 'experimental/app/target/release/mnema-native-client-preview.exe' $devExe
          # The probe is compiled out of the shipped executable. A separate build
          # with the feature on is what the check starts.
          $probeTarget = Join-Path $env:RUNNER_TEMP 'probe-target'
          $env:CARGO_TARGET_DIR = $probeTarget
          try {
            cargo build --locked --release --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol,webview-probe
            if ($LASTEXITCODE -ne 0) { throw 'Probe executable build failed' }
          } finally {
            Remove-Item Env:CARGO_TARGET_DIR -ErrorAction SilentlyContinue
          }
          $probeOutput = Join-Path $env:RUNNER_TEMP 'mnema-desktop-probe'
          New-Item -ItemType Directory -Path $probeOutput -Force | Out-Null
          $probeExe = Join-Path $probeOutput 'Mnema Desktop.exe'
          Copy-Item (Join-Path $probeTarget 'release/mnema-native-client-preview.exe') $probeExe
          $probeLog = Join-Path $env:RUNNER_TEMP 'webview-probe.log'
          if (Test-Path $probeLog) { Remove-Item $probeLog }
          $env:MNEMA_WEBVIEW_PROBE = '1'
          $env:MNEMA_WEBVIEW_PROBE_LOG = $probeLog
          # No physical microphone is installed on this runner. Wry sets
          # AdditionalBrowserArguments and that replaces
          # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS, so the host passes a
          # synthetic device itself while the probe variable is set. The fake
          # permission UI stays off, because it grants before the host is asked.
          Add-Type -AssemblyName UIAutomationClient
          try {
            $process = Start-Process -FilePath $probeExe -PassThru
            try {
              $windowReady = $false
              for ($attempt = 0; $attempt -lt 60; $attempt++) {
                Start-Sleep -Milliseconds 500
                $process.Refresh()
                if ($process.HasExited) { throw "Desktop exited before opening its window: $($process.ExitCode)" }
                $byProcess = [System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $process.Id)
                $byName = [System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::NameProperty, 'Mnema Desktop — Instance')
                $selector = [System.Windows.Automation.AutomationElement]::RootElement.FindFirst(
                  [System.Windows.Automation.TreeScope]::Children,
                  [System.Windows.Automation.AndCondition]::new($byProcess, $byName))
                if ($null -ne $selector -or $process.MainWindowTitle -eq 'Mnema Desktop — Instance') { $windowReady = $true; break }
              }
              if (!$windowReady) { throw 'Desktop selector window did not appear' }
              $probeReady = $false
              $probeDetail = ''
              for ($attempt = 0; $attempt -lt 90; $attempt++) {
                $process.Refresh()
                if ($process.HasExited) { throw "Desktop exited during the WebView2 probe: $($process.ExitCode)" }
                $probeDetail = (& ./scripts/assert-webview-probe.ps1 -LogPath $probeLog | Out-String).Trim()
                if ($probeDetail -eq 'OK') { $probeReady = $true; break }
                Start-Sleep -Milliseconds 500
              }
              if (!$probeReady) {
                $seen = if (Test-Path $probeLog) { Get-Content $probeLog -Raw } else { '(no probe record)' }
                throw "WebView2 probe did not complete: $probeDetail`n$seen"
              }
            } finally {
              if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
            }
          } finally {
            Remove-Item Env:MNEMA_WEBVIEW_PROBE -ErrorAction SilentlyContinue
            Remove-Item Env:MNEMA_WEBVIEW_PROBE_LOG -ErrorAction SilentlyContinue
          }
          Copy-Item 'experimental/licenses'  (Join-Path $devOutput 'licenses') -Recurse
          Copy-Item 'LICENSE' $devOutput
          Copy-Item 'THIRD_PARTY_NOTICES.md' (Join-Path $devOutput 'HOST_THIRD_PARTY_NOTICES.md')
          Copy-Item 'mnema-talk/THIRD_PARTY_NOTICES.md' $devOutput
          Copy-Item 'experimental/THIRD_PARTY_NOTICES.md' (Join-Path $devOutput 'NATIVE_THIRD_PARTY_NOTICES.md')
          Copy-Item 'experimental/README.md' (Join-Path $devOutput 'SOURCE_STATUS.md')
          $devReceipt = [ordered]@{
            kind = 'unsigned-web-desktop-client'
            revision = '${{ steps.source.outputs.sha }}'
            target = 'x86_64-pc-windows-msvc'
            executable = 'Mnema Desktop.exe'
            executable_sha256 = (Get-FileHash -Algorithm SHA256 $devExe).Hash.ToLowerInvariant()
            shared_frontend = 'web/src'
            instance_transport = 'verified-bundle-native-proxy'
            windows_startup_checked = $true
            webview_origin_checked = $true
            webview_origin = 'https://mnema.localhost/'
            media_permission_instance = 'engine-default'
            media_permission_other_windows = 'deny'
            media_devices = 'synthetic-fake-device'
            gaming_surface_origin_checked = $true
            physical_device_qualified = $false
            sealed_media_qualified = $false
            windows_gui_qualified = $false
            multi_device_e2ee_qualified = $false
            restored_history_qualified = $false
            native_voice_qualified = $false
            real_games_qualified = $false
            distribution_license_closure_complete = $false
            web_app = 'signed-bundle-verified-by-pinned-key'
            signed = $false
            automatic_updater_package = $false
          }
          $devReceipt | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $devOutput 'BUILD.json')
          @'
          Mnema Desktop — portable build, not code-signed

          This is the canonical Mnema Vue client in the experimental Tauri host.
          The web app runs from a signed bundle that the client verifies against a
          key pinned in the executable; the instance supplies data, never code.
          Enter the HTTPS address of a compatible normal Mnema instance.

          The Windows startup check confirmed the WebView2 origin
          (https://mnema.localhost), that the instance window leaves the
          microphone on WebView2's own prompt, and that the selector and the
          gaming surfaces are refused. The check uses a synthetic capture
          device and does not click the prompt. A human prompt, a physical
          device, sealed media, multi-device E2EE, restored history and real
          games are not qualified. The portable ZIP of a release updates itself from the signed portable ZIP of the next one.

          Check BUILD.json for the source revision and executable SHA-256.
          Source and dependency notices accompany this build. The existing prebuilt
          DeepFilterNet WASM still has an incomplete transitive provenance inventory;
          this build does not claim final distribution-license qualification.
          '@ | Set-Content -Encoding utf8 (Join-Path $devOutput 'README.txt')
      # What a person does with the portable ZIP of a release: unpack it anywhere
      # and start the program. It is packed here the way desktop-release.yml packs
      # it (the marker beside the executable), and it must run from the unpacked
      # folder without an installer and leave nothing in the profile's program
      # folder. That the marker makes the updater replace the copy's own files
      # instead of running the installer is covered by the native_updates tests
      # and the windows-update job.
      - name: The portable ZIP runs from its own folder and installs nothing
        if: inputs.acceptance_release == ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devOutput = Join-Path $env:RUNNER_TEMP 'mnema-desktop-windows-dev'
          $pack = Join-Path $env:RUNNER_TEMP 'portable-pack'
          $unpacked = Join-Path $env:RUNNER_TEMP 'portable-unpacked'
          Remove-Item $pack, $unpacked -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $pack | Out-Null
          Copy-Item (Join-Path $devOutput '*') $pack -Recurse
          Set-Content -Path (Join-Path $pack 'mnema-portable.marker') -Value 'portable'
          $zip = Join-Path $env:RUNNER_TEMP 'portable.zip'
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $pack '*') -DestinationPath $zip
          Expand-Archive $zip $unpacked
          $exe = Join-Path $unpacked 'Mnema Desktop.exe'
          if (!(Test-Path $exe)) { throw 'The unpacked ZIP has no program' }
          if (!(Test-Path (Join-Path $unpacked 'mnema-portable.marker'))) { throw 'The unpacked ZIP has no portable marker' }
          function Installed { Get-ChildItem $env:LOCALAPPDATA -Include 'mnema-native-client-preview.exe','Mnema Desktop.exe' -Recurse -Depth 3 -ErrorAction SilentlyContinue }
          if (Installed) { throw 'A copy is installed before the portable program ran' }
          # The portable copy keeps its files beside the program. Earlier steps of
          # this job started other builds and left their folders in the profile
          # (the folders are named after the identifier or the product), so the
          # check is a snapshot of every file in them before and after: any file
          # that appears or changes is a write the portable copy made there.
          function Snap {
            foreach ($root in $env:LOCALAPPDATA, $env:APPDATA) {
              Get-ChildItem $root -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'Mnema*' -or $_.Name -like 'com.mnema*' } | ForEach-Object {
                $_.FullName
                Get-ChildItem $_.FullName -Recurse -Force -File -ErrorAction SilentlyContinue | ForEach-Object { "$($_.FullName)|$($_.Length)|$($_.LastWriteTimeUtc.Ticks)" }
              }
            }
          }
          $before = @(Snap)
          Add-Type -AssemblyName UIAutomationClient
          $process = Start-Process -FilePath $exe -WorkingDirectory $unpacked -PassThru
          $started = $process.StartTime
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw "The portable program exited: $($process.ExitCode)" }
              $byProcess = [System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $process.Id)
              $window = [System.Windows.Automation.AutomationElement]::RootElement.FindFirst([System.Windows.Automation.TreeScope]::Children, $byProcess)
              if ($null -ne $window -or $process.MainWindowTitle) { $ready = $true; break }
            }
            if (!$ready) { throw 'The portable program opened no window' }
            # It stays up and in place for a while, as a running copy that checked for updates would.
            Start-Sleep -Seconds 20
            $process.Refresh()
            if ($process.HasExited) { throw "The portable program exited: $($process.ExitCode)" }
            if ($process.Path -ne $exe) { throw "The program runs from $($process.Path), not from the unpacked folder" }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          if (Installed) { throw 'The portable program installed a copy of itself' }
          # The one allowed write is the note that the earlier profile files were carried over.
          $stray = @(Snap | Where-Object { $before -notcontains $_ -and $_ -notlike '*\.adopted-by-portable|*' })
          if ($stray) { throw "The portable program wrote to the profile: $($stray -join ', ')" }
          $kept = Join-Path $unpacked 'mnema-data'
          if (!(Test-Path (Join-Path $kept 'data'))) { throw 'The portable program did not keep its data beside itself' }
          # The browser engine writes into the portable folder: a file of an
          # EBWebView folder written after the program started.
          $engine = @(Get-ChildItem $kept -Directory -Recurse -Filter EBWebView -ErrorAction SilentlyContinue |
            ForEach-Object { Get-ChildItem $_.FullName -Recurse -File -Force -ErrorAction SilentlyContinue } |
            Where-Object { $_.LastWriteTime -ge $started })
          if (!$engine) { throw 'The browser engine of the portable program wrote nothing beside it' }
      - name: Upload the unsigned portable Windows artifact
        if: inputs.acceptance_release == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mnema-desktop-windows-portable-${{ steps.source.outputs.sha }}
          path: ${{ runner.temp }}/mnema-desktop-windows-dev/
          if-no-files-found: error
          retention-days: 7
      # A release (desktop-release.yml) turns this tested executable into the
      # signed installer; nothing is rebuilt after the tests.
      - name: Upload the tested executable for the installer
        if: inputs.tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mnema-desktop-windows-exe-${{ steps.source.outputs.sha }}
          path: experimental/app/target/release/mnema-native-client-preview.exe
          if-no-files-found: error
          retention-days: 1

  # Toasts on a real Windows desktop: the NSIS installer of a build with the
  # test-only `notify-selftest` feature (never in a shipped build) is installed
  # silently, its Start-menu shortcut must carry the AppUserModelID the toasts
  # use, and the installed app must post one toast that Windows then holds in
  # ToastNotificationManager.History.GetHistory(<that ID>).
  windows-notifications:
    if: inputs.acceptance_release == ''
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      RUST_VERSION: 1.99.1
      CARGO_TARGET_DIR: ${{ github.workspace }}/experimental/app/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Select pinned Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install $env:RUST_VERSION --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default $env:RUST_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed' }
      # Restored on pull requests, saved only on main.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: experimental/app -> target
          key: ${{ hashFiles('**/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the pinned Tauri CLI
        working-directory: ui
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'CLI install failed' }
          node ../scripts/ensure-npm-optional.mjs .
          if ($LASTEXITCODE -ne 0) { throw 'Tauri CLI platform package missing' }
      - name: Build the host with the self-test and wrap it in the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $features = 'shell,web-client,custom-protocol,notify-selftest'
          cargo build --locked --release --manifest-path experimental/app/Cargo.toml --features $features
          if ($LASTEXITCODE -ne 0) { throw 'Host build failed' }
          Push-Location experimental/app
          # No updater signature for a throwaway installer.
          node ../../ui/node_modules/@tauri-apps/cli/tauri.js bundle --bundles nsis --features $features --config '{"bundle":{"createUpdaterArtifacts":false}}'
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          Pop-Location
          $setup = Get-ChildItem (Join-Path $env:CARGO_TARGET_DIR 'release/bundle/nsis') -Filter '*-setup.exe' | Select-Object -First 1
          if (!$setup) { throw 'Installer missing' }
          Copy-Item $setup.FullName (Join-Path $env:RUNNER_TEMP 'notify-setup.exe')
      - name: The installed app shows a toast that Windows holds for its AppUserModelID
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/test-windows-notify.ps1 -Installer (Join-Path $env:RUNNER_TEMP 'notify-setup.exe')
          if ($LASTEXITCODE -ne $null -and $LASTEXITCODE -ne 0) { throw 'The notification check failed' }

  # Up to 1.3.5 the app was called "Mnema Desktop DEV", and the installer names
  # its folder, its entry under Installed apps and its shortcuts after the
  # product. The installer of this build, signed with a throwaway updater key
  # the way a release rehearsal is, must update an installed copy of that
  # release in place (experimental/app/windows/installer-hooks.nsh):
  # scripts/test-windows-rename-update.ps1 installs it, updates it through a
  # feed made by scripts/update-manifest.mjs and checked by
  # scripts/verify-updater-signatures.mjs, and uninstalls.
  windows-update-from-dev:
    if: inputs.acceptance_release == ''
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      RUST_VERSION: 1.99.1
      CARGO_TARGET_DIR: ${{ github.workspace }}/experimental/app/target
      MNEMA_DESKTOP_NO_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Select pinned Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install $env:RUST_VERSION --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default $env:RUST_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed' }
      # Restored on pull requests, saved only on main.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: experimental/app -> target
          key: ${{ hashFiles('**/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Stage the signed web bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/stage-web-bundle.sh
      - name: Install the pinned Tauri CLI
        working-directory: ui
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'CLI install failed' }
          node ../scripts/ensure-npm-optional.mjs .
          if ($LASTEXITCODE -ne 0) { throw 'Tauri CLI platform package missing' }
      - name: Build the installer, sign it with a throwaway key and write its feed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $features = 'shell,web-client,custom-protocol'
          cargo build --locked --release --manifest-path experimental/app/Cargo.toml --features $features
          if ($LASTEXITCODE -ne 0) { throw 'Host build failed' }
          $password = node -e "console.log(require('crypto').randomBytes(16).toString('hex'))"
          Write-Host "::add-mask::$password"
          $keyFile = Join-Path $env:RUNNER_TEMP 'throwaway.key'
          node ui/node_modules/@tauri-apps/cli/tauri.js signer generate --ci -w $keyFile -p $password | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Key generation failed' }
          $env:TAURI_SIGNING_PRIVATE_KEY = (Get-Content -Raw $keyFile).Trim()
          Write-Host "::add-mask::$env:TAURI_SIGNING_PRIVATE_KEY"
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $password
          Push-Location experimental/app
          node ../../ui/node_modules/@tauri-apps/cli/tauri.js bundle --bundles nsis --features $features
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          Pop-Location
          Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY, Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          $setup = Get-ChildItem (Join-Path $env:CARGO_TARGET_DIR 'release/bundle/nsis') -Filter '*-setup.exe' | Select-Object -First 1
          if (!$setup -or !(Test-Path "$($setup.FullName).sig")) { throw 'Signed installer missing' }
          $version = node -p "require('./experimental/app/tauri.conf.json').version"
          $update = Join-Path $env:RUNNER_TEMP 'update'
          New-Item -ItemType Directory -Path $update -Force | Out-Null
          $name = "Mnema-Desktop_${version}_x64-setup.exe"
          Copy-Item $setup.FullName (Join-Path $update $name)
          Copy-Item "$($setup.FullName).sig" (Join-Path $update "$name.sig")
          $feed = Join-Path $update 'latest.json'
          node scripts/update-manifest.mjs --version $version --repo $env:GITHUB_REPOSITORY --installer (Join-Path $update $name) --sig (Join-Path $update "$name.sig") --out $feed
          if ($LASTEXITCODE -ne 0) { throw 'Feed build failed' }
          $env:UPDATER_PUBKEYS = (Get-Content -Raw "$keyFile.pub").Trim()
          node scripts/verify-updater-signatures.mjs $feed $update windows-x86_64
          if ($LASTEXITCODE -ne 0) { throw 'The feed does not verify' }
      - name: Fetch the Windows installer of the last release named DEV
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          old="Mnema-Desktop-DEV_${LAST_DEV_VERSION}_x64-setup.exe"
          gh release download "v$LAST_DEV_VERSION" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/old" --pattern "$old" --pattern SHA256SUMS
          cd "$RUNNER_TEMP/old" && grep -E "  ${old//./\\.}\$" SHA256SUMS | sha256sum -c -
      - name: The last release named DEV updates in place and uninstalls cleanly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $old = Join-Path $env:RUNNER_TEMP "old/Mnema-Desktop-DEV_$($env:LAST_DEV_VERSION)_x64-setup.exe"
          & ./scripts/test-windows-rename-update.ps1 -OldInstaller $old -Feed (Join-Path $env:RUNNER_TEMP 'update/latest.json')

  # A game takes the focus. A build with the test-only `gaming-selftest` feature
  # (never in a shipped build) simulates a Talk with gaming on and knows a
  # stand-in game; scripts/test-windows-gaming-hang.ps1 puts a borderless,
  # topmost, full-screen window up, moves the focus between it and an ordinary
  # window while key events and the overlay shortcut are sent, and requires that
  # none of the host's windows is ever hung or fails to answer a message.
  windows-gaming-responsive:
    if: inputs.acceptance_release == ''
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      RUST_VERSION: 1.99.1
      CARGO_TARGET_DIR: ${{ github.workspace }}/experimental/app/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Select pinned Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install $env:RUST_VERSION --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default $env:RUST_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed' }
      # Restored on pull requests, saved only on main.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: experimental/app -> target
          key: ${{ hashFiles('**/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Stage the signed web bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/stage-web-bundle.sh
      - name: Build the host with the gaming self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --locked --release --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol,gaming-selftest
          if ($LASTEXITCODE -ne 0) { throw 'Host build failed' }
      - name: The host keeps answering while a full-screen game takes the focus
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/test-windows-gaming-hang.ps1 -Exe (Join-Path $env:CARGO_TARGET_DIR 'release/mnema-native-client-preview.exe')
          if ($LASTEXITCODE -ne $null -and $LASTEXITCODE -ne 0) { throw 'The gaming responsiveness check failed' }

  # The whole self-update on a real Windows desktop, for the installer and for
  # the portable ZIP. Two builds with the test-only `update-selftest` feature
  # (never in a shipped build): an old and a new version whose updater config
  # names a throwaway key made in this job (never a release key) and a feed on
  # this machine. The new installer and the new portable ZIP are signed with
  # that key, the version bound into the signature, as a release is.
  # scripts/update-selftest.mjs serves them and starts the old program, which
  # finds the update at start, asks first during a simulated Talk, downloads and
  # verifies it, waits for the Talk to end, installs it and restarts; the new
  # version then reports its version and that it kept the data folder.
  windows-update:
    if: inputs.acceptance_release == ''
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      RUST_VERSION: 1.99.1
      CARGO_TARGET_DIR: ${{ github.workspace }}/experimental/app/target
      FEATURES: shell,web-client,custom-protocol,update-selftest
      FEED_PORT: '47613'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Select pinned Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install $env:RUST_VERSION --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default $env:RUST_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed' }
      # Restored on pull requests, saved only on main.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: experimental/app -> target
          key: ${{ hashFiles('**/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the pinned Tauri CLI
        working-directory: ui
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'CLI install failed' }
          node ../scripts/ensure-npm-optional.mjs .
          if ($LASTEXITCODE -ne 0) { throw 'Tauri CLI platform package missing' }
      - name: Make a throwaway updater key and the configs of the two versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'update'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $password = node -e "console.log(require('crypto').randomBytes(16).toString('hex'))"
          Write-Host "::add-mask::$password"
          $key = Join-Path $dir 'test.key'
          node ui/node_modules/@tauri-apps/cli/tauri.js signer generate --ci -w $key -p $password | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Key generation failed' }
          $secret = (Get-Content -Raw $key).Trim()
          Write-Host "::add-mask::$secret"
          Add-Content -Path $env:GITHUB_ENV -Value "TEST_KEY=$secret"
          Add-Content -Path $env:GITHUB_ENV -Value "TEST_KEY_PASSWORD=$password"
          node scripts/update-selftest.mjs config --pubkey-file "$key.pub" --port $env:FEED_PORT --version 1.0.0 --signed false --out (Join-Path $dir 'old.json')
          node scripts/update-selftest.mjs config --pubkey-file "$key.pub" --port $env:FEED_PORT --version 1.0.1 --signed true --out (Join-Path $dir 'new.json')
      - name: Build the old version (1.0.0)
        shell: pwsh
        working-directory: experimental/app
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'update'
          node ../../ui/node_modules/@tauri-apps/cli/tauri.js build --ci --bundles nsis --features $env:FEATURES --config (Join-Path $dir 'old.json')
          if ($LASTEXITCODE -ne 0) { throw 'Old build failed' }
          $setup = Get-ChildItem (Join-Path $env:CARGO_TARGET_DIR 'release/bundle/nsis') -Filter '*_1.0.0_*-setup.exe' | Select-Object -First 1
          if (!$setup) { throw 'Old installer missing' }
          Copy-Item $setup.FullName (Join-Path $dir 'old-setup.exe')
          $portable = Join-Path $dir 'old-portable'
          New-Item -ItemType Directory -Path $portable -Force | Out-Null
          Copy-Item (Join-Path $env:CARGO_TARGET_DIR 'release/mnema-native-client-preview.exe') (Join-Path $portable 'Mnema Desktop.exe')
          [System.IO.File]::WriteAllText((Join-Path $portable 'mnema-portable.marker'), "portable`n")
      - name: Build and sign the new version (1.0.1), installer and portable ZIP
        shell: pwsh
        working-directory: experimental/app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TEST_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TEST_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'update'
          node ../../ui/node_modules/@tauri-apps/cli/tauri.js build --ci --bundles nsis --features $env:FEATURES --config (Join-Path $dir 'new.json')
          if ($LASTEXITCODE -ne 0) { throw 'New build failed' }
          $setup = Get-ChildItem (Join-Path $env:CARGO_TARGET_DIR 'release/bundle/nsis') -Filter '*_1.0.1_*-setup.exe' | Select-Object -First 1
          if (!$setup -or !(Test-Path "$($setup.FullName).sig")) { throw 'Signed new installer missing' }
          $new = Join-Path $dir 'new'
          New-Item -ItemType Directory -Path $new -Force | Out-Null
          Copy-Item $setup.FullName (Join-Path $new 'new-setup.exe')
          Copy-Item "$($setup.FullName).sig" (Join-Path $new 'new-setup.exe.sig')
          # The portable ZIP as the release workflow packs and signs it.
          $pack = Join-Path $dir 'new-portable'
          New-Item -ItemType Directory -Path $pack -Force | Out-Null
          Copy-Item (Join-Path $env:CARGO_TARGET_DIR 'release/mnema-native-client-preview.exe') (Join-Path $pack 'Mnema Desktop.exe')
          Copy-Item '../../LICENSE' $pack
          [System.IO.File]::WriteAllText((Join-Path $pack 'mnema-portable.marker'), "portable`n")
          $zip = Join-Path $new 'new-portable.zip'
          $names = @(Get-ChildItem $pack -Name)
          & tar.exe -a -c -f $zip -C $pack @names
          if ($LASTEXITCODE -ne 0) { throw 'The portable ZIP could not be packed' }
          node ../../ui/node_modules/@tauri-apps/cli/tauri.js signer sign --app-version 1.0.1 $zip
          if ($LASTEXITCODE -ne 0 -or !(Test-Path "$zip.sig")) { throw 'The portable ZIP was not signed' }
      - name: The installed old version updates itself to the new one and restarts
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'update'
          $child = Start-Process -FilePath (Join-Path $dir 'old-setup.exe') -ArgumentList '/S' -PassThru
          if (!$child.WaitForExit(120000)) { throw 'The old installer did not finish' }
          if ($child.ExitCode -ne 0) { throw "Old installer exit code $($child.ExitCode)" }
          $exe = Get-ChildItem $env:LOCALAPPDATA -Include 'mnema-native-client-preview.exe','Mnema Desktop.exe' -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$exe) { throw 'The installed old version was not found' }
          try {
            node scripts/update-selftest.mjs --port $env:FEED_PORT --version 1.0.1 --old 1.0.0 --entry "windows-x86_64=$(Join-Path $dir 'new/new-setup.exe')" --record (Join-Path $dir 'installer.log') --run $exe.FullName
            if ($LASTEXITCODE -ne 0) { throw 'The installer update failed' }
            $installed = (Get-Item $exe.FullName).VersionInfo.ProductVersion
            if ($installed -ne '1.0.1') { throw "The installed program is $installed, not 1.0.1" }
          } finally {
            & taskkill.exe /F /IM (Split-Path $exe.FullName -Leaf) 2>$null | Out-Null
            # Nothing left to stop is not a failure of the step.
            $global:LASTEXITCODE = 0
          }
      - name: The portable old version replaces itself with the new one and restarts
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'update'
          $folder = Join-Path $dir 'old-portable'
          $exe = Join-Path $folder 'Mnema Desktop.exe'
          try {
            node scripts/update-selftest.mjs --port $env:FEED_PORT --version 1.0.1 --old 1.0.0 --entry "windows-x86_64-portable=$(Join-Path $dir 'new/new-portable.zip')" --record (Join-Path $dir 'portable.log') --run $exe
            if ($LASTEXITCODE -ne 0) { throw 'The portable update failed' }
            $want = (Get-FileHash (Join-Path $dir 'new-portable/Mnema Desktop.exe')).Hash
            if ((Get-FileHash $exe).Hash -ne $want) { throw 'The portable folder does not hold the new program' }
            if (!(Test-Path (Join-Path $folder 'LICENSE'))) { throw 'The other files of the new ZIP were not put in place' }
            if (Test-Path "$exe.old") { throw 'The replaced program was left behind' }
            if (!(Test-Path (Join-Path $folder 'mnema-data/data'))) { throw 'The data folder of the portable copy is gone' }
          } finally {
            & taskkill.exe /F /IM 'Mnema Desktop.exe' 2>$null | Out-Null
            $global:LASTEXITCODE = 0
          }

  # The same on macOS: the old app replaces itself from the signed app archive
  # of the new version (the Tauri updater) and restarts through the system.
  macos-update:
    if: inputs.acceptance_release == ''
    runs-on: macos-15
    timeout-minutes: 75
    env:
      RUST_VERSION: 1.99.1
      CARGO_TARGET_DIR: ${{ github.workspace }}/experimental/app/target
      FEATURES: shell,web-client,custom-protocol,update-selftest
      FEED_PORT: '47613'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      # Restored on pull requests, saved only on main.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: experimental/app -> target
          key: ${{ hashFiles('**/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the pinned Tauri CLI
        working-directory: ui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node ../scripts/ensure-npm-optional.mjs .
      - name: Make a throwaway updater key and the configs of the two versions
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/update"
          mkdir -p "$dir"
          password="$(node -e "console.log(require('crypto').randomBytes(16).toString('hex'))")"
          echo "::add-mask::$password"
          node ui/node_modules/@tauri-apps/cli/tauri.js signer generate --ci -w "$dir/test.key" -p "$password" >/dev/null
          secret="$(cat "$dir/test.key")"
          echo "::add-mask::$secret"
          { echo "TEST_KEY=$secret"; echo "TEST_KEY_PASSWORD=$password"; } >> "$GITHUB_ENV"
          node scripts/update-selftest.mjs config --pubkey-file "$dir/test.key.pub" --port "$FEED_PORT" --version 1.0.0 --signed false --out "$dir/old.json"
          node scripts/update-selftest.mjs config --pubkey-file "$dir/test.key.pub" --port "$FEED_PORT" --version 1.0.1 --signed true --out "$dir/new.json"
      - name: Build the old version (1.0.0)
        working-directory: experimental/app
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/update"
          node ../../ui/node_modules/@tauri-apps/cli/tauri.js build --ci --bundles app --features "$FEATURES" --config "$dir/old.json"
          mkdir -p "$dir/old"
          ditto "$CARGO_TARGET_DIR/release/bundle/macos/Mnema Desktop.app" "$dir/old/Mnema Desktop.app"
      - name: Build and sign the new version (1.0.1)
        working-directory: experimental/app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TEST_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/update"
          node ../../ui/node_modules/@tauri-apps/cli/tauri.js build --ci --bundles app --features "$FEATURES" --config "$dir/new.json"
          archive="$CARGO_TARGET_DIR/release/bundle/macos/Mnema Desktop.app.tar.gz"
          [ -f "$archive" ] && [ -f "$archive.sig" ] || { echo '::error::the signed app archive is missing'; exit 1; }
          mkdir -p "$dir/new"
          cp "$archive" "$dir/new/new.app.tar.gz"
          cp "$archive.sig" "$dir/new/new.app.tar.gz.sig"
      - name: The old app updates itself to the new one and restarts
        timeout-minutes: 20
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/update"
          app="$dir/old/Mnema Desktop.app"
          status=0
          node scripts/update-selftest.mjs --port "$FEED_PORT" --version 1.0.1 --old 1.0.0 \
            --entry "darwin-aarch64=$dir/new/new.app.tar.gz" --record "$dir/macos.log" \
            --run "$app/Contents/MacOS/mnema-native-client-preview" || status=$?
          pkill -f "Mnema Desktop.app/Contents/MacOS" || true
          [ "$status" = 0 ] || exit "$status"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          [ "$version" = 1.0.1 ] || { echo "::error::the app in place is $version, not 1.0.1"; exit 1; }

  # Several servers side by side on a real Windows desktop: a build with the
  # test-only `multi-selftest` feature (never in a shipped build) adds two
  # stand-in instances, signs in to both, and checks that browser storage,
  # cookies, counters and sockets of one are not those of the other, that a
  # report from the server in the background raises its own badge while the
  # other is in front, that Ctrl+1/2 switch, and that removing one wipes its
  # stored session and its WebView2 profile. The instances answer from this
  # machine; scripts/multi-instance-selftest.mjs reads the host's record and
  # what the instances saw.
  windows-multi-instance:
    if: inputs.acceptance_release == ''
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      RUST_VERSION: 1.99.1
      CARGO_TARGET_DIR: ${{ github.workspace }}/experimental/app/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Select pinned Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install $env:RUST_VERSION --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default $env:RUST_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed' }
      # Restored on pull requests, saved only on main.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: experimental/app -> target
          key: ${{ hashFiles('**/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Stage the signed web bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/stage-web-bundle.sh
      - name: Build the host with the self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --locked --release --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol,multi-selftest
          if ($LASTEXITCODE -ne 0) { throw 'Host build failed' }
      - name: Two servers side by side, isolated from each other
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/multi-instance-selftest.mjs experimental/app/target/release/mnema-native-client-preview.exe
          if ($LASTEXITCODE -ne 0) { throw 'The multi-instance check failed' }

  # The same host against a REAL mnema-talk server instead of stand-ins: the
  # Go binary is built from the pinned release, PostgreSQL and SeaweedFS run
  # as local processes (no Docker on Windows or macOS runners), and the server
  # listens on a port of its own and is entered as http://localhost:18443. The
  # test-only `real-selftest` feature (src/selftest_real.rs) adds it, loads the
  # signed web bundle for it, signs in, opens the WebSocket, sends a message and
  # sees it arrive; scripts/real-server-selftest.mjs then restarts the server on
  # the same port and database and the host must carry on. No microphone,
  # camera or audio is involved.
  windows-real-server:
    if: inputs.acceptance_release == ''
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      RUST_VERSION: 1.99.1
      CARGO_TARGET_DIR: ${{ github.workspace }}/experimental/app/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mnema-xyz/talk
          ref: ${{ env.REAL_SERVER_REV }}
          path: server
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Select pinned Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install $env:RUST_VERSION --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default $env:RUST_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed' }
      # Restored on pull requests, saved only on main.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: experimental/app -> target
          key: ${{ hashFiles('**/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Stage the signed web bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/stage-web-bundle.sh
      - name: Build the host with the real-server self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --locked --release --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol,real-selftest
          if ($LASTEXITCODE -ne 0) { throw 'Host build failed' }
      # The web app is not embedded: the host runs its own signed bundle, and
      # the server is only asked for data. The tracked web/dist placeholder is enough to build.
      - name: Build the server from the pinned release
        shell: pwsh
        working-directory: server
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne $env:REAL_SERVER_REV) { throw 'The server checkout is not the pinned revision' }
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags "-X github.com/msch128/mnema-talk/internal/version.Version=$($env:REAL_SERVER_TAG.Substring(1))" -o "$env:RUNNER_TEMP/mnema-server.exe" ./cmd/server
          if ($LASTEXITCODE -ne 0) { throw 'Server build failed' }
      - name: Fetch SeaweedFS
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $digest = 'e3dfe6c441686887b8fdde4420aa2c11ad9c8ce152340bd053e8176e07851a26'
          gh release download $env:SEAWEEDFS_VERSION --repo seaweedfs/seaweedfs --pattern windows_amd64.zip --dir "$env:RUNNER_TEMP/weed-download"
          if ($LASTEXITCODE -ne 0) { throw 'SeaweedFS download failed' }
          $zip = "$env:RUNNER_TEMP/weed-download/windows_amd64.zip"
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant() -ne $digest) { throw 'SeaweedFS archive digest mismatch' }
          Expand-Archive $zip "$env:RUNNER_TEMP/weed"
          "WEED_EXE=$env:RUNNER_TEMP/weed/weed.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      # The runner's own PostgreSQL, as a private cluster on loopback (as the
      # normal-backend fixture does it).
      - name: Start PostgreSQL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pg = Get-ChildItem (Join-Path $env:ProgramFiles 'PostgreSQL') -Directory | Where-Object { $_.Name -in '17','18' } | Sort-Object Name -Descending | Select-Object -First 1
          if ($null -eq $pg) { throw 'A preinstalled PostgreSQL 17 or 18 is required' }
          $bin = Join-Path $pg.FullName 'bin'
          $data = Join-Path $env:RUNNER_TEMP 'pg-data'
          & (Join-Path $bin 'initdb.exe') -D $data -U mnema -A trust -E UTF8 --locale=C
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL cluster initialization failed' }
          & (Join-Path $bin 'pg_ctl.exe') -D $data -l (Join-Path $env:RUNNER_TEMP 'postgres.log') -o '-h 127.0.0.1 -p 55432' -w -t 60 start
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL startup failed' }
          & (Join-Path $bin 'createdb.exe') -h 127.0.0.1 -p 55432 -U mnema mnema_selftest
          if ($LASTEXITCODE -ne 0) { throw 'Database creation failed' }
          'DATABASE_URL=postgres://mnema@127.0.0.1:55432/mnema_selftest?sslmode=disable' | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: The host against a real server, through a restart of it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/real-server-selftest.mjs experimental/app/target/release/mnema-native-client-preview.exe "$env:RUNNER_TEMP/mnema-server.exe"
          if ($LASTEXITCODE -ne 0) { throw 'The real-server check failed' }

  macos-real-server:
    if: inputs.acceptance_release == ''
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RUST_VERSION: 1.99.1
      CARGO_TARGET_DIR: ${{ github.workspace }}/experimental/app/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mnema-xyz/talk
          ref: ${{ env.REAL_SERVER_REV }}
          path: server
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      # Restored on pull requests, saved only on main.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: experimental/app -> target
          key: ${{ hashFiles('**/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Stage the signed web bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/stage-web-bundle.sh
      - name: Build the host with the real-server self-test
        run: cargo build --locked --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol,real-selftest
      - name: Build the server from the pinned release
        working-directory: server
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$REAL_SERVER_REV" ] || { echo '::error::the server checkout is not the pinned revision'; exit 1; }
          CGO_ENABLED=0 go build -trimpath -ldflags "-X github.com/msch128/mnema-talk/internal/version.Version=${REAL_SERVER_TAG#v}" -o "$RUNNER_TEMP/mnema-server" ./cmd/server
      - name: Fetch SeaweedFS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          digest=7aed4f7db8048a8aedab47a71ea4dd3875caa5abdb925d6aa72fb65438a47910
          gh release download "$SEAWEEDFS_VERSION" --repo seaweedfs/seaweedfs --pattern darwin_arm64.tar.gz --dir "$RUNNER_TEMP/weed-download"
          [ "$(shasum -a 256 "$RUNNER_TEMP/weed-download/darwin_arm64.tar.gz" | cut -d' ' -f1)" = "$digest" ] || { echo '::error::SeaweedFS archive digest mismatch'; exit 1; }
          mkdir "$RUNNER_TEMP/weed"
          tar -xzf "$RUNNER_TEMP/weed-download/darwin_arm64.tar.gz" -C "$RUNNER_TEMP/weed"
          echo "WEED_EXE=$RUNNER_TEMP/weed/weed" >> "$GITHUB_ENV"
      # Homebrew can hiccup on the network: a bounded retry, nothing else.
      - name: Start PostgreSQL
        timeout-minutes: 10
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            brew install postgresql@18 && break
            echo "brew install failed (attempt $attempt)" >&2
            [ "$attempt" -lt 3 ] || exit 1
            sleep 10
          done
          bin="$(brew --prefix postgresql@18)/bin"
          data="$RUNNER_TEMP/pg-data"
          "$bin/initdb" -D "$data" -U mnema --auth=trust -E UTF8 --locale=C >/dev/null
          "$bin/pg_ctl" -D "$data" -o "-h 127.0.0.1 -p 55432 -k $RUNNER_TEMP" -l "$RUNNER_TEMP/postgres.log" -w start
          "$bin/createdb" -h 127.0.0.1 -p 55432 -U mnema mnema_selftest
          echo 'DATABASE_URL=postgres://mnema@127.0.0.1:55432/mnema_selftest?sslmode=disable' >> "$GITHUB_ENV"
      - name: The host against a real server, through a restart of it
        run: node scripts/real-server-selftest.mjs "$CARGO_TARGET_DIR/debug/mnema-native-client-preview" "$RUNNER_TEMP/mnema-server"

  # The same host on macOS: unit tests and Clippy on every change, and for a
  # release the Apple silicon (arm64) executable that desktop-release.yml
  # turns into the app bundle. The macOS build has no gaming overlay (the
  # Windows-only parts are compiled out) and is ad-hoc signed, not notarized.
  macos-client:
    if: ${{ inputs.acceptance_release == '' }}
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      revision: ${{ steps.source.outputs.sha }}
    env:
      RUST_VERSION: 1.99.1
      CARGO_TARGET_DIR: ${{ github.workspace }}/experimental/app/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Capture actual source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy \
            --target aarch64-apple-darwin
          rustup default "$RUST_VERSION"
      - name: Stage the signed web bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash scripts/stage-web-bundle.sh
      - name: Fetch a signed release package for the signature tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v$FIXTURE_VERSION" --repo "$GITHUB_REPOSITORY" --dir signed-package --pattern "Mnema-Desktop-DEV_${FIXTURE_VERSION}_aarch64.app.tar.gz*"
      - name: Test and lint the shared-client host for macOS
        env:
          # A release build must embed a bundle; the test checks that the pinned key verifies it.
          MNEMA_REQUIRE_BUNDLE: ${{ inputs.tag != '' && '1' || '' }}
          MNEMA_TEST_BUNDLE_ZIP: ${{ github.workspace }}/experimental/app/bundle/builtin.zip
          MNEMA_TEST_UPDATE_PACKAGE: ${{ github.workspace }}/signed-package/Mnema-Desktop-DEV_${{ env.FIXTURE_VERSION }}_aarch64.app.tar.gz
          MNEMA_TEST_UPDATE_VERSION: ${{ env.FIXTURE_VERSION }}
          # Items written by keyring 3 (releases up to 0.3.x) stay readable (web_vault.rs).
          MNEMA_KEYRING_COMPAT: '1'
        run: |
          cargo test --locked --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol
          # Servers that offer only TLS 1.3, only TLS 1.2 (local, test CA): Secure Transport has no TLS 1.3, the host's own stack must reach both.
          cargo test --locked --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol tls_1_
          cargo test --locked --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol public_https -- --ignored
          cargo clippy --locked --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol --all-targets -- -D warnings
          # The test-only features are linted too: they are code that CI builds and runs.
          cargo clippy --locked --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol,multi-selftest,gaming-selftest,notify-selftest,webview-probe --all-targets -- -D warnings
      # Two servers side by side (see windows-multi-instance): the data stores
      # of WKWebView keep their storage apart from macOS 14 on.
      - name: Two servers side by side, isolated from each other
        run: |
          cargo build --locked --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol,multi-selftest
          node scripts/multi-instance-selftest.mjs "$CARGO_TARGET_DIR/debug/mnema-native-client-preview"
      # The debug build above does not run what ships (no debug assertions,
      # optimised code), so a release also runs the check on the release
      # profile: the shipped executable is this build without the test feature.
      - name: Two servers side by side, on the release profile
        if: inputs.tag != ''
        run: |
          set -euo pipefail
          cargo build --locked --release --target aarch64-apple-darwin --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol,multi-selftest
          node scripts/multi-instance-selftest.mjs "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/mnema-native-client-preview"
      # A release (desktop-release.yml) bundles the executable built below,
      # which is not rebuilt afterwards.
      - name: Build the Apple silicon executable
        if: inputs.tag != ''
        env:
          MNEMA_REQUIRE_BUNDLE: '1'
        run: |
          set -euo pipefail
          cargo build --locked --release --target aarch64-apple-darwin --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol
          archs="$(lipo -archs "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/mnema-native-client-preview")"
          echo "Architectures: $archs"
          [[ "$archs" == "arm64" ]] || { echo '::error::the executable is not arm64 only'; exit 1; }
          echo 'Unsigned Apple silicon macOS host linked from experimental/app with the signed web bundle embedded. The release workflow ad-hoc signs it; it is not notarized.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the executable for the app bundle
        if: inputs.tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mnema-desktop-macos-exe-${{ steps.source.outputs.sha }}
          path: experimental/app/target/aarch64-apple-darwin/release/mnema-native-client-preview
          if-no-files-found: error
          retention-days: 1
