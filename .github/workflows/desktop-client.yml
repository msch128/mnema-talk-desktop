name: Shared desktop client DEV builds

on:
  workflow_call:
    outputs:
      revision:
        description: Source revision that was built
        value: ${{ jobs.windows-client.outputs.revision }}
      macos-revision:
        description: Source revision that the macOS executable was built from
        value: ${{ jobs.macos-client.outputs.revision }}
    inputs:
      ref:
        required: true
        type: string
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      acceptance_release:
        description: 'Optional mnema-talk release tag through v0.7.3 to test instead of building'
        required: false
        type: string
      acceptance_instance:
        description: 'Public HTTPS origin for unauthenticated release acceptance'
        required: false
        type: string
      acceptance_fixture:
        description: 'Use an isolated local normal-backend fixture for login/chat/logout'
        required: false
        default: false
        type: boolean
      acceptance_voice:
        description: 'Extend the owned fixture with SFU microphone RTP and voice controls (synthetic input)'
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - experimental/**
      - icons/**
      - scripts/**
      - test-vectors/**
      - ui/**
      - src/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/desktop-client.yml
  push:
    branches: [main, 'codex/**']
    paths:
      - experimental/**
      - icons/**
      - scripts/**
      - test-vectors/**
      - ui/**
      - src/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/desktop-client.yml

permissions:
  contents: read

concurrency:
  group: shared-desktop-${{ inputs.acceptance_release && format('{0}-{1}', inputs.acceptance_release, github.sha) || inputs.tag || github.ref }}
  # Superseded pull request runs are cancelled; tag, push and acceptance runs never are.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-client:
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      revision: ${{ steps.source.outputs.sha }}
    env:
      RUST_VERSION: 1.99.1
      CARGO_TARGET_DIR: ${{ github.workspace }}/experimental/app/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      # The Vue app stays in mnema-talk. This host only embeds its built dist
      # and then loads the selected instance. Default ref is that repo's main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: msch128/mnema-talk
          ref: ${{ inputs.acceptance_release || 'main' }}
          path: mnema-talk
          persist-credentials: false
      - name: Capture actual source revision
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: inputs.acceptance_fixture
        with:
          go-version-file: mnema-talk/go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.acceptance_fixture
        with:
          node-version: 26
      - name: Build released canonical web assets for the normal backend fixture
        if: inputs.acceptance_fixture
        working-directory: mnema-talk/web
        shell: powershell
        env:
          ACCEPTANCE_RELEASE: ${{ inputs.acceptance_release }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:ACCEPTANCE_RELEASE -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'An existing release tag is required' }
          $env:MNEMA_VERSION = $env:ACCEPTANCE_RELEASE.Substring(1)
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Fixture web dependencies failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Fixture web build failed' }
      - name: Test the published Windows release against an actual instance
        timeout-minutes: 15
        # This dispatch-only setup uses the unchanged released web/backend tree.
        # Generated credentials, certificates and database files stay in runner.temp.
        if: inputs.acceptance_release != ''
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_RELEASE: ${{ inputs.acceptance_release }}
          ACCEPTANCE_INSTANCE: ${{ inputs.acceptance_instance }}
          ACCEPTANCE_FIXTURE: ${{ inputs.acceptance_fixture }}
          ACCEPTANCE_VOICE: ${{ inputs.acceptance_voice }}
        working-directory: mnema-talk
        run: |
          if ($env:ACCEPTANCE_VOICE -eq 'true' -and $env:ACCEPTANCE_FIXTURE -ne 'true') { throw 'Voice acceptance requires the owned fixture' }
          if ($env:ACCEPTANCE_FIXTURE -eq 'true') {
            ../scripts/test-windows-auth-fixture.ps1 -Tag $env:ACCEPTANCE_RELEASE -VoiceAcceptance:($env:ACCEPTANCE_VOICE -eq 'true')
          } else {
            ../scripts/test-windows-release.ps1 -Tag $env:ACCEPTANCE_RELEASE -InstanceUrl $env:ACCEPTANCE_INSTANCE
          }
      - name: Upload bounded Windows acceptance result
        if: inputs.acceptance_release != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-published-release-acceptance
          path: |
            ${{ runner.temp }}/windows-release-acceptance/ACCEPTANCE.json
            ${{ runner.temp }}/windows-release-acceptance/SERVER-RESULT.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.acceptance_release == ''
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mnema-talk/web/package-lock.json
      - name: Select pinned Rust toolchain
        if: inputs.acceptance_release == ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install $env:RUST_VERSION --profile minimal --component clippy --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default $env:RUST_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed' }
      # Restored on pull requests, saved only on main (and the ci/speed proof branch).
      - if: inputs.acceptance_release == ''
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: experimental/app -> target
          key: ${{ hashFiles('**/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.head_ref == 'ci/speed' }}
      - name: Check and build the canonical Vue client
        if: inputs.acceptance_release == ''
        working-directory: mnema-talk/web
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Web dependencies failed' }
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw 'Web lint failed' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Web typecheck failed' }
          npm run test -- --run
          if ($LASTEXITCODE -ne 0) { throw 'Web tests failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Web build failed' }
      # The web app runs from a signed bundle (mnema-talk
      # doc/desktop-trusted-client.md). The build embeds the one attached to
      # the newest mnema-talk release that has one; the host verifies it with
      # the key pinned in its source, so a bundle from anywhere else is useless.
      - name: Stage the signed web bundle
        if: inputs.acceptance_release == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash scripts/stage-web-bundle.sh

      - name: Check and link the canonical protected native host on Windows
        if: inputs.acceptance_release == ''
        shell: pwsh
        run: |
          node scripts/checked-glib.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed dependency source verification failed' }
          cargo test --locked --manifest-path experimental/crates/crypto-owner/qualified-sdk/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Protected SDK tests failed' }
          cargo test --locked --manifest-path experimental/crates/crypto-owner/Cargo.toml --features opaque-relay
          if ($LASTEXITCODE -ne 0) { throw 'Protected chat-owner tests failed' }
          cargo build --locked --release --manifest-path experimental/app/Cargo.toml --features shell,native-crypto,custom-protocol
          if ($LASTEXITCODE -ne 0) { throw 'Protected native host link failed' }
          cargo test --locked --manifest-path experimental/vendor/openmls/Cargo.toml -p openmls_rust_crypto -p openmls_basic_credential -p openmls_sqlite_storage
          if ($LASTEXITCODE -ne 0) { throw 'OpenMLS ECDSA provider tests failed' }
          cargo test --locked --manifest-path experimental/vendor/openmls/Cargo.toml -p openmls --test mnema_ecdsa_roundtrip
          if ($LASTEXITCODE -ne 0) { throw 'OpenMLS group round trip tests failed' }
      # A real package from a published release, signed by the release pipeline:
      # the host's signature check runs on it, not only on packages the tests sign.
      - name: Fetch a signed release package for the signature tests
        if: inputs.acceptance_release == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.3.1 --repo msch128/mnema-talk-desktop --dir signed-package --pattern 'Mnema-Desktop-DEV_0.3.1_x64-setup.exe*'
      - name: Check and link the actual shared-client Tauri host
        if: inputs.acceptance_release == ''
        shell: pwsh
        env:
          # A release build must embed a bundle; the test checks that the pinned key verifies it.
          MNEMA_REQUIRE_BUNDLE: ${{ inputs.tag != '' && '1' || '' }}
          MNEMA_TEST_BUNDLE_ZIP: ${{ github.workspace }}/experimental/app/bundle/builtin.zip
          MNEMA_TEST_UPDATE_PACKAGE: ${{ github.workspace }}/signed-package/Mnema-Desktop-DEV_0.3.1_x64-setup.exe
          MNEMA_TEST_UPDATE_VERSION: '0.3.1'
          # Items written by keyring 3 (releases up to 0.3.x) stay readable (web_vault.rs).
          MNEMA_KEYRING_COMPAT: '1'
        run: |
          node scripts/checked-glib.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed dependency source verification failed' }
          cargo test --locked --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol
          if ($LASTEXITCODE -ne 0) { throw 'Shared host tests failed' }
          cargo clippy --locked --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Shared host Clippy failed' }
          cargo build --locked --release --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol
          if ($LASTEXITCODE -ne 0) { throw 'Shared Windows executable build failed' }
          if (!(Test-Path 'experimental/app/target/release/mnema-native-client-preview.exe')) { throw 'Shared executable missing' }
          'Unsigned DEV web-client host linked from experimental/app with embedded web/dist. The next step checks the WebView2 origin and the media-permission decision with a synthetic capture device. It does not click a prompt and does not qualify a physical device, sealed media, multi-device E2EE, real games, fullscreen overlays or distribution licenses. The installer of a release updates itself; this portable executable does not.' | Out-File -Append $env:GITHUB_STEP_SUMMARY
      - name: Prepare unsigned Windows DEV artifact
        if: inputs.acceptance_release == ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devOutput = Join-Path $env:RUNNER_TEMP 'mnema-desktop-windows-dev'
          New-Item -ItemType Directory -Path $devOutput -Force | Out-Null
          $devExe = Join-Path $devOutput 'Mnema Desktop DEV.exe'
          Copy-Item 'experimental/app/target/release/mnema-native-client-preview.exe' $devExe
          $probeLog = Join-Path $env:RUNNER_TEMP 'webview-probe.log'
          if (Test-Path $probeLog) { Remove-Item $probeLog }
          $env:MNEMA_WEBVIEW_PROBE = '1'
          $env:MNEMA_WEBVIEW_PROBE_LOG = $probeLog
          # No physical microphone is installed on this runner. Wry sets
          # AdditionalBrowserArguments and that replaces
          # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS, so the host passes a
          # synthetic device itself while the probe variable is set. The fake
          # permission UI stays off, because it grants before the host is asked.
          Add-Type -AssemblyName UIAutomationClient
          try {
            $process = Start-Process -FilePath $devExe -PassThru
            try {
              $windowReady = $false
              for ($attempt = 0; $attempt -lt 60; $attempt++) {
                Start-Sleep -Milliseconds 500
                $process.Refresh()
                if ($process.HasExited) { throw "Desktop exited before opening its window: $($process.ExitCode)" }
                $byProcess = [System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $process.Id)
                $byName = [System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::NameProperty, 'Mnema Desktop DEV — Instance')
                $selector = [System.Windows.Automation.AutomationElement]::RootElement.FindFirst(
                  [System.Windows.Automation.TreeScope]::Children,
                  [System.Windows.Automation.AndCondition]::new($byProcess, $byName))
                if ($null -ne $selector -or $process.MainWindowTitle -eq 'Mnema Desktop DEV — Instance') { $windowReady = $true; break }
              }
              if (!$windowReady) { throw 'Desktop selector window did not appear' }
              $probeReady = $false
              $probeDetail = ''
              for ($attempt = 0; $attempt -lt 90; $attempt++) {
                $process.Refresh()
                if ($process.HasExited) { throw "Desktop exited during the WebView2 probe: $($process.ExitCode)" }
                $probeDetail = (& ./scripts/assert-webview-probe.ps1 -LogPath $probeLog | Out-String).Trim()
                if ($probeDetail -eq 'OK') { $probeReady = $true; break }
                Start-Sleep -Milliseconds 500
              }
              if (!$probeReady) {
                $seen = if (Test-Path $probeLog) { Get-Content $probeLog -Raw } else { '(no probe record)' }
                throw "WebView2 probe did not complete: $probeDetail`n$seen"
              }
            } finally {
              if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
            }
          } finally {
            Remove-Item Env:MNEMA_WEBVIEW_PROBE -ErrorAction SilentlyContinue
            Remove-Item Env:MNEMA_WEBVIEW_PROBE_LOG -ErrorAction SilentlyContinue
          }
          Copy-Item 'experimental/licenses'  (Join-Path $devOutput 'licenses') -Recurse
          Copy-Item 'LICENSE' $devOutput
          Copy-Item 'mnema-talk/THIRD_PARTY_NOTICES.md' $devOutput
          Copy-Item 'experimental/THIRD_PARTY_NOTICES.md' (Join-Path $devOutput 'NATIVE_THIRD_PARTY_NOTICES.md')
          Copy-Item 'experimental/README.md' (Join-Path $devOutput 'SOURCE_STATUS.md')
          $devReceipt = [ordered]@{
            kind = 'unsigned-development-web-desktop-client'
            revision = '${{ steps.source.outputs.sha }}'
            target = 'x86_64-pc-windows-msvc'
            executable = 'Mnema Desktop DEV.exe'
            executable_sha256 = (Get-FileHash -Algorithm SHA256 $devExe).Hash.ToLowerInvariant()
            shared_frontend = 'web/src'
            instance_transport = 'verified-bundle-native-proxy'
            windows_startup_checked = $true
            webview_origin_checked = $true
            webview_origin = 'https://mnema.localhost/'
            media_permission_instance = 'engine-default'
            media_permission_other_windows = 'deny'
            media_devices = 'synthetic-fake-device'
            gaming_surface_origin_checked = $true
            physical_device_qualified = $false
            sealed_media_qualified = $false
            synthetic_fixture_features = $false
            windows_gui_qualified = $false
            multi_device_e2ee_qualified = $false
            restored_history_qualified = $false
            native_voice_qualified = $false
            real_games_qualified = $false
            distribution_license_closure_complete = $false
            web_app = 'signed-bundle-verified-by-pinned-key'
            signed = $false
            automatic_updater_package = $false
          }
          $devReceipt | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $devOutput 'DEV-BUILD.json')
          @'
          Mnema Desktop DEV — unsigned development build

          This is the canonical Mnema Vue client in the experimental Tauri host.
          The web app runs from a signed bundle that the client verifies against a
          key pinned in the executable; the instance supplies data, never code.
          Enter the HTTPS address of a compatible normal Mnema instance.

          The Windows startup check confirmed the WebView2 origin
          (https://mnema.localhost), that the instance window leaves the
          microphone on WebView2's own prompt, and that the selector and the
          gaming surfaces are refused. The check uses a synthetic capture
          device and does not click the prompt. A human prompt, a physical
          device, sealed media, multi-device E2EE, restored history and real
          games are not qualified. This portable ZIP does not update itself; the installer of a release does.

          Check DEV-BUILD.json for the source revision and executable SHA-256.
          Source and dependency notices accompany this build. The existing prebuilt
          DeepFilterNet WASM still has an incomplete transitive provenance inventory;
          this build does not claim final distribution-license qualification.
          '@ | Set-Content -Encoding utf8 (Join-Path $devOutput 'README-DEV.txt')
      - name: Upload explicitly unsigned Windows DEV artifact
        if: inputs.acceptance_release == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mnema-desktop-windows-DEV-UNSIGNED-${{ steps.source.outputs.sha }}
          path: ${{ runner.temp }}/mnema-desktop-windows-dev/
          if-no-files-found: error
          retention-days: 7
      # A release (desktop-release.yml) turns this tested executable into the
      # signed installer; nothing is rebuilt after the tests.
      - name: Upload the tested executable for the installer
        if: inputs.tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mnema-desktop-windows-exe-${{ steps.source.outputs.sha }}
          path: experimental/app/target/release/mnema-native-client-preview.exe
          if-no-files-found: error
          retention-days: 1

  # Toasts on a real Windows desktop: the NSIS installer of a build with the
  # test-only `notify-selftest` feature (never in a shipped build) is installed
  # silently, its Start-menu shortcut must carry the AppUserModelID the toasts
  # use, and the installed app must post one toast that Windows then holds in
  # ToastNotificationManager.History.GetHistory(<that ID>).
  windows-notifications:
    if: inputs.acceptance_release == ''
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      RUST_VERSION: 1.99.1
      CARGO_TARGET_DIR: ${{ github.workspace }}/experimental/app/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Select pinned Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install $env:RUST_VERSION --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default $env:RUST_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed' }
      # Restored on pull requests, saved only on main (and the ci/speed proof branch).
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: experimental/app -> target
          key: ${{ hashFiles('**/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.head_ref == 'ci/speed' }}
      - name: Install the pinned Tauri CLI
        working-directory: ui
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'CLI install failed' }
          node ../scripts/ensure-npm-optional.mjs .
          if ($LASTEXITCODE -ne 0) { throw 'Tauri CLI platform package missing' }
      - name: Build the host with the self-test and wrap it in the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/checked-glib.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed dependency source verification failed' }
          $features = 'shell,web-client,custom-protocol,notify-selftest'
          cargo build --locked --release --manifest-path experimental/app/Cargo.toml --features $features
          if ($LASTEXITCODE -ne 0) { throw 'Host build failed' }
          Push-Location experimental/app
          # No updater signature for a throwaway installer.
          node ../../ui/node_modules/@tauri-apps/cli/tauri.js bundle --bundles nsis --features $features --config '{"bundle":{"createUpdaterArtifacts":false}}'
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          Pop-Location
          $setup = Get-ChildItem (Join-Path $env:CARGO_TARGET_DIR 'release/bundle/nsis') -Filter '*-setup.exe' | Select-Object -First 1
          if (!$setup) { throw 'Installer missing' }
          Copy-Item $setup.FullName (Join-Path $env:RUNNER_TEMP 'notify-setup.exe')
      - name: The installed app shows a toast that Windows holds for its AppUserModelID
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/test-windows-notify.ps1 -Installer (Join-Path $env:RUNNER_TEMP 'notify-setup.exe')
          if ($LASTEXITCODE -ne $null -and $LASTEXITCODE -ne 0) { throw 'The notification check failed' }

  # Several servers side by side on a real Windows desktop: a build with the
  # test-only `multi-selftest` feature (never in a shipped build) adds two
  # stand-in instances, signs in to both, and checks that browser storage,
  # cookies, counters and sockets of one are not those of the other, that a
  # report from the server in the background raises its own badge while the
  # other is in front, that Ctrl+1/2 switch, and that removing one wipes its
  # stored session and its WebView2 profile. The instances answer from this
  # machine; scripts/multi-instance-selftest.mjs reads the host's record and
  # what the instances saw.
  windows-multi-instance:
    if: inputs.acceptance_release == ''
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      RUST_VERSION: 1.99.0
      CARGO_TARGET_DIR: ${{ github.workspace }}/experimental/app/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Select pinned Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install $env:RUST_VERSION --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default $env:RUST_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed' }
      # Restored on pull requests, saved only on main (and the ci/speed proof branch).
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: experimental/app -> target
          key: ${{ hashFiles('**/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.head_ref == 'ci/speed' }}
      - name: Stage the signed web bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/stage-web-bundle.sh
      - name: Build the host with the self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/checked-glib.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed dependency source verification failed' }
          cargo build --locked --release --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol,multi-selftest
          if ($LASTEXITCODE -ne 0) { throw 'Host build failed' }
      - name: Two servers side by side, isolated from each other
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/multi-instance-selftest.mjs experimental/app/target/release/mnema-native-client-preview.exe
          if ($LASTEXITCODE -ne 0) { throw 'The multi-instance check failed' }

  # The same host on macOS: unit tests and Clippy on every change, and for a
  # release the Apple silicon (arm64) executable that desktop-release.yml
  # turns into the app bundle. The macOS build has no gaming overlay (the
  # Windows-only parts are compiled out) and is ad-hoc signed, not notarized.
  # PAUSED: the macOS client is paused for capacity (1.2), only Windows is built.
  # The job is kept as it was; remove `false &&` to resume it.
  macos-client:
    if: ${{ false && inputs.acceptance_release == '' }}
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      revision: ${{ steps.source.outputs.sha }}
    env:
      RUST_VERSION: 1.99.1
      CARGO_TARGET_DIR: ${{ github.workspace }}/experimental/app/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Capture actual source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy \
            --target aarch64-apple-darwin
          rustup default "$RUST_VERSION"
      - name: Stage the signed web bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash scripts/stage-web-bundle.sh
      - name: Fetch a signed release package for the signature tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.3.1 --repo msch128/mnema-talk-desktop --dir signed-package --pattern 'Mnema-Desktop-DEV_0.3.1_aarch64.app.tar.gz*'
      - name: Test and lint the shared-client host for macOS
        env:
          # A release build must embed a bundle; the test checks that the pinned key verifies it.
          MNEMA_REQUIRE_BUNDLE: ${{ inputs.tag != '' && '1' || '' }}
          MNEMA_TEST_BUNDLE_ZIP: ${{ github.workspace }}/experimental/app/bundle/builtin.zip
          MNEMA_TEST_UPDATE_PACKAGE: ${{ github.workspace }}/signed-package/Mnema-Desktop-DEV_0.3.1_aarch64.app.tar.gz
          MNEMA_TEST_UPDATE_VERSION: '0.3.1'
          # Items written by keyring 3 (releases up to 0.3.x) stay readable (web_vault.rs).
          MNEMA_KEYRING_COMPAT: '1'
        run: |
          node scripts/checked-glib.mjs
          cargo test --locked --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol
          cargo clippy --locked --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol --all-targets -- -D warnings
      # Two servers side by side (see windows-multi-instance): the data stores
      # of WKWebView keep their storage apart from macOS 14 on.
      - name: Two servers side by side, isolated from each other
        run: |
          cargo build --locked --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol,multi-selftest
          node scripts/multi-instance-selftest.mjs "$CARGO_TARGET_DIR/debug/mnema-native-client-preview"
      # A release (desktop-release.yml) bundles this tested executable; nothing
      # is rebuilt after the tests.
      - name: Build the Apple silicon executable
        if: inputs.tag != ''
        env:
          MNEMA_REQUIRE_BUNDLE: '1'
        run: |
          set -euo pipefail
          cargo build --locked --release --target aarch64-apple-darwin --manifest-path experimental/app/Cargo.toml --features shell,web-client,custom-protocol
          archs="$(lipo -archs "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/mnema-native-client-preview")"
          echo "Architectures: $archs"
          [[ "$archs" == "arm64" ]] || { echo '::error::the executable is not arm64 only'; exit 1; }
          echo 'Unsigned Apple silicon macOS host linked from experimental/app with the signed web bundle embedded. The release workflow ad-hoc signs it; it is not notarized.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the tested executable for the app bundle
        if: inputs.tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mnema-desktop-macos-exe-${{ steps.source.outputs.sha }}
          path: experimental/app/target/aarch64-apple-darwin/release/mnema-native-client-preview
          if-no-files-found: error
          retention-days: 1
