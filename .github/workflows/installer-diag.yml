name: Installer diag (temporary)

on:
  push:
    branches: ['fix/installer-hang']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/desktop-client.yml
    with:
      ref: ${{ github.sha }}
      tag: v0.0.0-diag

  installer:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3]
    env:
      RUST_VERSION: 1.99.0
      CARGO_TARGET_DIR: ${{ github.workspace }}/experimental/app/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mnema-desktop-windows-exe-${{ needs.build.outputs.revision }}
          path: experimental/app/target/release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Select pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
      - name: Install the pinned Tauri CLI
        working-directory: ui
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the installer from the tested executable
        shell: pwsh
        working-directory: experimental/app
        run: |
          $ErrorActionPreference = 'Stop'
          node ../../ui/node_modules/@tauri-apps/cli/tauri.js bundle --bundles nsis --features shell,web-client,custom-protocol --config '{"bundle":{"createUpdaterArtifacts":false}}'
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          $setup = Get-ChildItem (Join-Path $env:CARGO_TARGET_DIR 'release/bundle/nsis') -Filter '*-setup.exe' | Select-Object -First 1
          $out = Join-Path $env:RUNNER_TEMP 'installer'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item $setup.FullName (Join-Path $out 'Mnema-Desktop-DEV_0.0.0_x64-setup.exe')
      - name: Release step verbatim, with a watchdog dumping the tree
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $watch = @'
          Start-Sleep -Seconds 100
          Write-Host "=== WATCHDOG: process tree after 100s"
          Get-CimInstance Win32_Process | Select-Object ProcessId, ParentProcessId, Name, @{n='Cmd';e={ "$($_.CommandLine)".Substring(0, [Math]::Min(160, "$($_.CommandLine)".Length)) }} | Format-Table -AutoSize -Wrap | Out-String -Width 250 | Write-Host
          '@
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'watch.ps1') -Value $watch
          Start-Process pwsh -ArgumentList '-NoProfile','-File',(Join-Path $env:RUNNER_TEMP 'watch.ps1') -NoNewWindow
          $installer = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'installer') -Filter '*-setup.exe' | Select-Object -First 1
          Write-Host 'installing'
          $p = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          Write-Host "installed: $($p.ExitCode)"
          $exe = Get-ChildItem $env:LOCALAPPDATA -Include 'mnema-native-client-preview.exe','Mnema Desktop DEV.exe' -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object -First 1
          $process = Start-Process -FilePath $exe.FullName -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw "Installed program exited: $($process.ExitCode)" }
              if ($process.MainWindowTitle -eq 'Mnema Desktop DEV — Instance') { $ready = $true; break }
            }
            if (!$ready) { throw 'Installed program showed no window' }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          Write-Host 'stopped; uninstalling'
          $uninstall = Join-Path $exe.DirectoryName 'uninstall.exe'
          Start-Process -FilePath $uninstall -ArgumentList '/S' -Wait
          Write-Host 'uninstalled'
