name: Installer diag (temporary)

on:
  push:
    branches: ['fix/installer-hang']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      RUST_VERSION: 1.99.0
      CARGO_TARGET_DIR: ${{ github.workspace }}/experimental/app/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Select pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
      - name: Install the pinned Tauri CLI
        working-directory: ui
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/checked-glib.mjs
          $features = 'shell,web-client,custom-protocol'
          cargo build --locked --release --manifest-path experimental/app/Cargo.toml --features $features
          if ($LASTEXITCODE -ne 0) { throw 'Host build failed' }
          Push-Location experimental/app
          node ../../ui/node_modules/@tauri-apps/cli/tauri.js bundle --bundles nsis --features $features --config '{"bundle":{"createUpdaterArtifacts":false}}'
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          Pop-Location
          $setup = Get-ChildItem (Join-Path $env:CARGO_TARGET_DIR 'release/bundle/nsis') -Filter '*-setup.exe' | Select-Object -First 1
          Copy-Item $setup.FullName (Join-Path $env:RUNNER_TEMP 'setup.exe')
      - name: Same steps as the release job, with a process tree and timeouts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Tree($label) {
            Write-Host "=== process tree: $label"
            Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -like "$env:LOCALAPPDATA*" -or $_.Name -match 'mnema|Mnema|msedgewebview2|uninstall|setup|Un_A|~nsu' } |
              Select-Object ProcessId, ParentProcessId, Name, CommandLine | Format-Table -AutoSize -Wrap | Out-String -Width 300 | Write-Host
          }
          function Run($file, $arguments, $seconds) {
            $p = Start-Process -FilePath $file -ArgumentList $arguments -PassThru
            if (!$p.WaitForExit($seconds * 1000)) {
              Write-Host "TIMEOUT after ${seconds}s: $file $arguments"
              Tree "hung $file"
              return $null
            }
            return $p.ExitCode
          }
          $setup = Join-Path $env:RUNNER_TEMP 'setup.exe'
          $code = Run $setup '/S' 120
          Write-Host "installer exit: $code"
          $exe = Get-ChildItem $env:LOCALAPPDATA -Include 'mnema-native-client-preview.exe','Mnema Desktop DEV.exe' -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object -First 1
          Write-Host "exe: $($exe.FullName)"
          Get-ChildItem $exe.DirectoryName | Format-Table Name, Length | Out-String | Write-Host
          $process = Start-Process -FilePath $exe.FullName -PassThru
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Milliseconds 500
            $process.Refresh()
            if ($process.HasExited) { throw "exited $($process.ExitCode)" }
            if ($process.MainWindowTitle -eq 'Mnema Desktop DEV — Instance') { break }
          }
          Start-Sleep -Seconds 5
          Tree 'running, before Stop-Process'
          Stop-Process -Id $process.Id -Force
          Start-Sleep -Seconds 2
          Tree 'after Stop-Process of the parent'
          $uninstall = Join-Path $exe.DirectoryName 'uninstall.exe'
          $code = Run $uninstall '/S' 90
          Write-Host "uninstaller exit: $code"
          Tree 'after uninstall'
          if ($null -eq $code) { throw 'uninstaller hung' }
