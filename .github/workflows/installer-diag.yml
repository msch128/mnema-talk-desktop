name: Installer diag (temporary)

on:
  push:
    branches: ['fix/installer-hang']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      RUST_VERSION: 1.99.0
      CARGO_TARGET_DIR: ${{ github.workspace }}/experimental/app/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Select pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
      - name: Install the pinned Tauri CLI
        working-directory: ui
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/checked-glib.mjs
          $features = 'shell,web-client,custom-protocol'
          cargo build --locked --release --manifest-path experimental/app/Cargo.toml --features $features
          if ($LASTEXITCODE -ne 0) { throw 'Host build failed' }
          Push-Location experimental/app
          node ../../ui/node_modules/@tauri-apps/cli/tauri.js bundle --bundles nsis --features $features --config '{"bundle":{"createUpdaterArtifacts":false}}'
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          Pop-Location
          $setup = Get-ChildItem (Join-Path $env:CARGO_TARGET_DIR 'release/bundle/nsis') -Filter '*-setup.exe' | Select-Object -First 1
          Copy-Item $setup.FullName (Join-Path $env:RUNNER_TEMP 'setup.exe')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: setup
          path: ${{ runner.temp }}/setup.exe
      - name: Loop the release step, killing the app as early as the release step does
        shell: pwsh
        timeout-minutes: 25
        run: |
          $ErrorActionPreference = 'Stop'
          function Tree($label) {
            Write-Host "=== process tree: $label"
            Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'mnema|Mnema|msedgewebview2|uninstall|setup|Un_A|~nsu' } |
              Select-Object ProcessId, ParentProcessId, Name | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          }
          function Run($file, $arguments, $seconds) {
            $p = Start-Process -FilePath $file -ArgumentList $arguments -PassThru
            if (!$p.WaitForExit($seconds * 1000)) { Write-Host "TIMEOUT after ${seconds}s: $file"; Tree "hung $file"; return $null }
            return $p.ExitCode
          }
          $setup = Join-Path $env:RUNNER_TEMP 'setup.exe'
          $hung = 0
          foreach ($n in 1..12) {
            $null = Run $setup '/S' 120
            $exe = Get-ChildItem $env:LOCALAPPDATA -Include 'mnema-native-client-preview.exe' -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object -First 1
            $process = Start-Process -FilePath $exe.FullName -PassThru
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.MainWindowTitle -eq 'Mnema Desktop DEV — Instance') { break }
            }
            Stop-Process -Id $process.Id -Force
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $code = Run (Join-Path $exe.DirectoryName 'uninstall.exe') '/S' 60
            Write-Host "iteration $n uninstall exit=$code after $($sw.ElapsedMilliseconds)ms"
            if ($null -eq $code) {
              $hung++
              # What a person would see: any dialog owned by the uninstaller.
              Add-Type -AssemblyName UIAutomationClient
              $root = [System.Windows.Automation.AutomationElement]::RootElement
              foreach ($w in $root.FindAll([System.Windows.Automation.TreeScope]::Children, [System.Windows.Automation.Condition]::TrueCondition)) { Write-Host "window: '$($w.Current.Name)' pid=$($w.Current.ProcessId)" }
              Get-Process | Where-Object { $_.Name -match 'Un_A|uninstall|mnema' } | Stop-Process -Force -ErrorAction SilentlyContinue
            }
          }
          Write-Host "hung iterations: $hung"
