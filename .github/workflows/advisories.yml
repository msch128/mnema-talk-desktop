name: Advisories

# The same advisory checks the push and pull request workflows run (npm audit
# for the three UI/Electron trees, cargo audit for the Rust lockfiles), on a
# schedule: an advisory published after the last push to the shipped client
# would otherwise go unnoticed until someone pushes again.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/advisories.yml

permissions:
  contents: read

env:
  CARGO_AUDIT_VERSION: 0.22.2

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dir: [ui, linux, experimental/ui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
      - name: Shipped dependencies have no known high advisory
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high

  cargo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Rust advisory scan (pinned tool; no advisory ignores)
        run: |
          set -euo pipefail
          cargo +1.99.0 install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
          node scripts/checked-glib.mjs --audit
          cargo audit --file Cargo.lock
