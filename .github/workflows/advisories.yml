name: Advisories

# The same advisory checks the push and pull request workflows run (npm audit
# for the three UI/Electron trees, cargo deny for the Rust lockfiles), on a
# schedule: an advisory published after the last push to the shipped client
# would otherwise go unnoticed until someone pushes again.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/advisories.yml
      - deny.toml
      - scripts/deny-all.sh
      - experimental/**/Cargo.lock
      - experimental/licenses/**
      - experimental/scripts/collect-licenses.mjs

permissions:
  contents: read

env:
  CARGO_DENY_VERSION: 0.20.2

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dir: [ui, linux, experimental/ui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Shipped dependencies have no known high advisory
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high

  cargo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      # Scoped to the Windows target (deny.toml): Linux is paused, and the
      # Linux-only GTK3 crates are not in the Windows build. One documented
      # exception, see doc/security-review-1.2.md.
      - name: Rust advisory scan (pinned tool, Windows graph)
        run: |
          set -euo pipefail
          cargo +1.99.1 install cargo-deny --version "$CARGO_DENY_VERSION" --locked
          node scripts/checked-glib.mjs
          bash scripts/deny-all.sh

  # The experimental host's license bundle binds the app Cargo.lock and the
  # web app's package-lock.json. It must be regenerated with
  # `node experimental/scripts/collect-licenses.mjs` (mnema-talk checked out at
  # ./mnema-talk, `npm ci` in mnema-talk/web) whenever either changes; this job
  # fails otherwise. It runs weekly and on pull requests that touch the locks or
  # the bundle, not on every push, because the web app's lock lives in the other
  # repository.
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: msch128/mnema-talk
          ref: main
          path: mnema-talk
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: The license bundle matches the locks
        run: |
          set -euo pipefail
          npm ci --prefix mnema-talk/web --ignore-scripts --no-audit --no-fund
          cargo +1.99.1 fetch --locked --manifest-path experimental/app/Cargo.toml
          node experimental/scripts/collect-licenses.mjs --check
