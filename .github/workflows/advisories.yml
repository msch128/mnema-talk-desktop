name: Advisories

# The same advisory checks the push and pull request workflows run (npm audit
# for the Tauri CLI pin and the Electron tree, cargo deny for the Rust lockfiles), on a
# schedule: an advisory published after the last push to the shipped client
# would otherwise go unnoticed until someone pushes again.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/advisories.yml
      - deny.toml
      - scripts/deny-all.sh
      - experimental/**/Cargo.lock
      - experimental/licenses/**
      - experimental/scripts/collect-licenses.mjs
      - scripts/license-bundle.mjs

permissions:
  contents: read

concurrency:
  group: advisories-${{ github.ref }}
  # Superseded pull request runs are cancelled; push, tag and manual runs never are.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_DENY_VERSION: 0.20.2

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dir: [ui, linux, experimental/app/page-tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - name: Shipped dependencies have no known high advisory
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high

  cargo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      # Scoped to the shipped Tauri targets, Windows and macOS (deny.toml): the Linux
      # client is Electron, and the Linux-only GTK3 crates are not in those builds.
      - name: Rust advisory scan (pinned tool, Windows and macOS graph)
        run: |
          set -euo pipefail
          cargo +1.99.1 install cargo-deny --version "$CARGO_DENY_VERSION" --locked
          bash scripts/deny-all.sh

  # The experimental host's license bundle binds the app Cargo.lock and the
  # web app's package-lock.json. The web lock is read from the mnema-talk commit
  # pinned in experimental/licenses/web-source.txt, so this check depends only
  # on this repository and does not fail when the web app's lock moves on. To
  # refresh: set the pin to a newer mnema-talk commit, `npm ci` in
  # mnema-talk/web, run `node experimental/scripts/collect-licenses.mjs`, review
  # and commit the manifest. The weekly run reports (as a warning) when the web
  # lock on main differs from the pinned one.
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the pinned mnema-talk commit
        run: |
          set -euo pipefail
          sha=$(tr -d '[:space:]' < experimental/licenses/web-source.txt)
          git init --quiet mnema-talk
          git -C mnema-talk fetch --quiet --depth=1 https://github.com/mnema-xyz/talk.git "$sha"
          git -C mnema-talk checkout --quiet --detach FETCH_HEAD
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: The license bundle matches the locks
        run: |
          set -euo pipefail
          npm ci --prefix mnema-talk/web --ignore-scripts --no-audit --no-fund
          cargo +1.99.1 fetch --locked --manifest-path experimental/app/Cargo.toml
          node experimental/scripts/collect-licenses.mjs --check
      - name: The web lock on main has moved on (weekly run only)
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          git -C mnema-talk fetch --quiet --depth=1 https://github.com/mnema-xyz/talk.git main
          pinned=$(sha256sum mnema-talk/web/package-lock.json | cut -d' ' -f1)
          current=$(git -C mnema-talk show FETCH_HEAD:web/package-lock.json | sha256sum | cut -d' ' -f1)
          if [ "$pinned" != "$current" ]; then
            echo "::warning::The web app's package-lock.json on main differs from the pinned commit; refresh experimental/licenses/web-source.txt and the manifest."
          fi
