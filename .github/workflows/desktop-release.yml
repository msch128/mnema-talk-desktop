name: Desktop release

# Tag vX.Y.Z (a commit on main whose app version is X.Y.Z) builds, tests and
# signs the Windows installer and publishes it with the updater feed
# (latest.json). Installed clients find it at
# https://github.com/msch128/mnema-talk-desktop/releases/latest/download/latest.json
# and verify it against the public key pinned in tauri.conf.json.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on main and matches the app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          node scripts/check-release-version.mjs "$TAG"
          node --test scripts/*.test.mjs

  build:
    needs: verify-tag
    uses: ./.github/workflows/desktop-client.yml
    with:
      ref: ${{ github.sha }}
      tag: ${{ github.ref_name }}

  installer:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 40
    # The signing key exists only in this protected environment (tags v*).
    environment: desktop-updater-signing
    env:
      RUST_VERSION: 1.99.0
      CARGO_TARGET_DIR: ${{ github.workspace }}/experimental/app/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mnema-desktop-windows-exe-${{ needs.build.outputs.revision }}
          path: experimental/app/target/release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Select pinned Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
      # Dependencies are installed before the key is in the environment, and
      # without install scripts.
      - name: Install the pinned Tauri CLI
        working-directory: ui
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'CLI install failed' }
      - name: Build and sign the installer from the tested executable
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: experimental/app
        run: |
          $ErrorActionPreference = 'Stop'
          node ../../ui/node_modules/@tauri-apps/cli/tauri.js bundle --bundles nsis --features shell,web-client,custom-protocol
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          $dir = Join-Path $env:CARGO_TARGET_DIR 'release/bundle/nsis'
          $setup = Get-ChildItem $dir -Filter '*-setup.exe' | Select-Object -First 1
          if (!$setup -or !(Test-Path "$($setup.FullName).sig")) { throw 'Signed installer missing' }
          $out = Join-Path $env:RUNNER_TEMP 'installer'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $name = "Mnema-Desktop-DEV_${tag}_x64-setup.exe"
          Copy-Item $setup.FullName (Join-Path $out $name)
          Copy-Item "$($setup.FullName).sig" (Join-Path $out "$name.sig")
      - name: The installer installs per user, starts and uninstalls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'installer') -Filter '*-setup.exe' | Select-Object -First 1
          $p = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exit code $($p.ExitCode)" }
          # Tauri installs the main binary under the crate name unless told otherwise.
          $exe = Get-ChildItem $env:LOCALAPPDATA -Include 'mnema-native-client-preview.exe','Mnema Desktop DEV.exe' -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$exe) { throw 'Installed program not found in the user profile' }
          $process = Start-Process -FilePath $exe.FullName -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw "Installed program exited: $($process.ExitCode)" }
              if ($process.MainWindowTitle -eq 'Mnema Desktop DEV — Instance') { $ready = $true; break }
            }
            if (!$ready) { throw 'Installed program showed no window' }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          $uninstall = Join-Path $exe.DirectoryName 'uninstall.exe'
          if (!(Test-Path $uninstall)) { throw 'Uninstaller missing' }
          Start-Process -FilePath $uninstall -ArgumentList '/S' -Wait
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mnema-desktop-installer
          path: ${{ runner.temp }}/installer/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [build, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mnema-desktop-installer
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mnema-desktop-windows-DEV-UNSIGNED-${{ needs.build.outputs.revision }}
          path: portable
      - name: Publish the release (draft until complete)
        run: |
          set -euo pipefail
          version="${TAG#v}"
          installer="$(ls release/*-setup.exe)"
          node scripts/update-manifest.mjs --version "$version" --repo "$GITHUB_REPOSITORY" \
            --installer "$installer" --sig "$installer.sig" --out release/latest.json
          (cd portable && zip -qr "../release/Mnema-Desktop-DEV-${TAG}-windows-x64-portable.zip" .)
          (cd release && sha256sum -- *.exe *.zip > SHA256SUMS)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Mnema Desktop $TAG" \
            --notes "Windows installer with automatic updates. Installed clients update themselves; the signature is checked against a key built into the app. The portable ZIP is unsigned and does not update itself." \
            release/*.exe release/*.exe.sig release/*.zip release/latest.json release/SHA256SUMS
          # Clients look at latest/download/latest.json: published last.
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
