name: Desktop release

# Tag vX.Y.Z (a commit on main whose app version is X.Y.Z) builds, tests and
# signs the Windows installer, the macOS app for Apple silicon (ad-hoc signed, not
# notarized) and the Linux AppImages (x86_64, arm64; plus a .deb each, which the
# package manager installs after the update was verified) and publishes them with
# the updater feed (latest.json). Installed clients find it at
# https://github.com/msch128/mnema-talk-desktop/releases/latest/download/latest.json
# and verify it against the public key pinned in tauri.conf.json.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on main and matches the app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          node scripts/check-release-version.mjs "$TAG"
          node --test scripts/*.test.mjs

  build:
    needs: verify-tag
    uses: ./.github/workflows/desktop-client.yml
    with:
      ref: ${{ github.sha }}
      tag: ${{ github.ref_name }}

  installer:
    needs: build
    runs-on: windows-2025
    # The build and signing take about a minute, the install check seconds.
    timeout-minutes: 20
    # The signing key exists only in this protected environment (tags v*).
    environment: desktop-updater-signing
    env:
      RUST_VERSION: 1.99.0
      CARGO_TARGET_DIR: ${{ github.workspace }}/experimental/app/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mnema-desktop-windows-exe-${{ needs.build.outputs.revision }}
          path: experimental/app/target/release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Select pinned Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
      # Dependencies are installed before the key is in the environment, and
      # without install scripts.
      - name: Install the pinned Tauri CLI
        working-directory: ui
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'CLI install failed' }
      - name: Build and sign the installer from the tested executable
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: experimental/app
        run: |
          $ErrorActionPreference = 'Stop'
          node ../../ui/node_modules/@tauri-apps/cli/tauri.js bundle --bundles nsis --features shell,web-client,custom-protocol
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          $dir = Join-Path $env:CARGO_TARGET_DIR 'release/bundle/nsis'
          $setup = Get-ChildItem $dir -Filter '*-setup.exe' | Select-Object -First 1
          if (!$setup -or !(Test-Path "$($setup.FullName).sig")) { throw 'Signed installer missing' }
          $out = Join-Path $env:RUNNER_TEMP 'installer'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $name = "Mnema-Desktop-DEV_${tag}_x64-setup.exe"
          Copy-Item $setup.FullName (Join-Path $out $name)
          Copy-Item "$($setup.FullName).sig" (Join-Path $out "$name.sig")
      - name: The installer installs per user, starts and uninstalls
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          # Start-Process -Wait also waits for every process the child started,
          # and has no limit. Wait on the child itself, with a limit, and show
          # what is still running when it is exceeded.
          function Show-Processes($label) {
            Write-Host "Processes after $label"
            Get-CimInstance Win32_Process |
              Where-Object { $_.ExecutablePath -like "$env:LOCALAPPDATA*" -or $_.Name -match 'mnema|msedgewebview2|uninstall|setup|Un_A' } |
              Select-Object ProcessId, ParentProcessId, Name | Format-Table -AutoSize | Out-String | Write-Host
          }
          function Invoke-Limited($file, $arguments, $seconds) {
            $child = Start-Process -FilePath $file -ArgumentList $arguments -PassThru
            if (!$child.WaitForExit($seconds * 1000)) {
              Show-Processes "$file exceeded ${seconds}s"
              & taskkill.exe /T /F /PID $child.Id | Out-Null
              throw "$file did not finish within ${seconds}s"
            }
            return $child.ExitCode
          }
          $installer = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'installer') -Filter '*-setup.exe' | Select-Object -First 1
          $code = Invoke-Limited $installer.FullName '/S' 120
          if ($code -ne 0) { throw "Installer exit code $code" }
          # Tauri installs the main binary under the crate name unless told otherwise.
          $exe = Get-ChildItem $env:LOCALAPPDATA -Include 'mnema-native-client-preview.exe','Mnema Desktop DEV.exe' -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$exe) { throw 'Installed program not found in the user profile' }
          $process = Start-Process -FilePath $exe.FullName -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw "Installed program exited: $($process.ExitCode)" }
              if ($process.MainWindowTitle -eq 'Mnema Desktop DEV — Instance') { $ready = $true; break }
            }
            if (!$ready) { throw 'Installed program showed no window' }
          } finally {
            # The program and the WebView2 processes it started.
            if (!$process.HasExited) { & taskkill.exe /T /F /PID $process.Id | Out-Null }
          }
          $uninstall = Join-Path $exe.DirectoryName 'uninstall.exe'
          if (!(Test-Path $uninstall)) { throw 'Uninstaller missing' }
          $code = Invoke-Limited $uninstall '/S' 120
          if ($code -ne 0) { throw "Uninstaller exit code $code" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mnema-desktop-installer
          path: ${{ runner.temp }}/installer/
          if-no-files-found: error
          retention-days: 1

  macos-app:
    needs: build
    runs-on: macos-15
    timeout-minutes: 40
    # The signing key exists only in this protected environment (tags v*).
    environment: desktop-updater-signing
    env:
      RUST_VERSION: 1.99.0
      CARGO_TARGET_DIR: ${{ github.workspace }}/experimental/app/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mnema-desktop-macos-exe-${{ needs.build.outputs.macos-revision }}
          path: experimental/app/target/aarch64-apple-darwin/release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      # Dependencies are installed before the key is in the environment, and
      # without install scripts.
      - name: Install the pinned Tauri CLI
        working-directory: ui
        run: npm ci --ignore-scripts --no-audit --no-fund
      # The executable is the tested one; the bundle step only wraps it, signs
      # the app ad hoc (tauri.macos.conf.json) and signs the updater archive.
      - name: Bundle the app from the tested executable
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: experimental/app
        run: |
          set -euo pipefail
          chmod +x target/aarch64-apple-darwin/release/mnema-native-client-preview
          node ../../ui/node_modules/@tauri-apps/cli/tauri.js bundle --target aarch64-apple-darwin --bundles app --features shell,web-client,custom-protocol
      - name: Name the release files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bundle="$CARGO_TARGET_DIR/aarch64-apple-darwin/release/bundle/macos"
          app="$bundle/Mnema Desktop DEV.app"
          archive="$bundle/Mnema Desktop DEV.app.tar.gz"
          [ -d "$app" ] && [ -f "$archive" ] && [ -f "$archive.sig" ] || { echo '::error::signed app archive missing'; exit 1; }
          out="$RUNNER_TEMP/macos"
          mkdir -p "$out" "$RUNNER_TEMP/dmg"
          version="${TAG#v}"
          name="Mnema-Desktop-DEV_${version}_aarch64"
          cp "$archive" "$out/$name.app.tar.gz"
          cp "$archive.sig" "$out/$name.app.tar.gz.sig"
          # A plain disk image (app and a link to /Applications). It is built
          # with hdiutil, not by scripting the Finder, so it needs no desktop.
          ditto "$app" "$RUNNER_TEMP/dmg/Mnema Desktop DEV.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          cp LICENSE THIRD_PARTY_NOTICES.md "$RUNNER_TEMP/dmg/"
          hdiutil create -volname "Mnema Desktop DEV" -srcfolder "$RUNNER_TEMP/dmg" -ov -format UDZO "$out/$name.dmg"
      # What an updated client ends up with is the archive's app: unpack it the
      # way the updater does and run that.
      - name: The app is arm64 only, ad-hoc signed, asks for the devices and starts
        run: |
          set -euo pipefail
          check="$RUNNER_TEMP/check"
          mkdir -p "$check"
          tar -xzf "$RUNNER_TEMP/macos/"*.app.tar.gz -C "$check"
          app="$check/Mnema Desktop DEV.app"
          exe="$app/Contents/MacOS/mnema-native-client-preview"
          archs="$(lipo -archs "$exe")"
          echo "Architectures: $archs"
          [[ "$archs" == "arm64" ]] || { echo '::error::the app is not arm64 only'; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign -dv "$app" 2>&1)"
          [[ "$signature" == *"Signature=adhoc"* ]] || { echo '::error::the app is not ad-hoc signed'; exit 1; }
          plutil -extract NSMicrophoneUsageDescription raw "$app/Contents/Info.plist" >/dev/null
          plutil -extract NSCameraUsageDescription raw "$app/Contents/Info.plist" >/dev/null
          # Only a browser download is quarantined; the updater's download is not.
          attributes="$(xattr -lr "$app" || true)"
          [[ "$attributes" != *com.apple.quarantine* ]] || { echo '::error::the app carries a quarantine mark'; exit 1; }
          mount_dir="$RUNNER_TEMP/mount"
          mkdir -p "$mount_dir"
          hdiutil attach "$RUNNER_TEMP/macos/"*.dmg -mountpoint "$mount_dir" -nobrowse -quiet
          test -d "$mount_dir/Mnema Desktop DEV.app" && test -L "$mount_dir/Applications"
          hdiutil detach "$mount_dir" -quiet
          log="$RUNNER_TEMP/start.log"
          MNEMA_DEBUG_PROTOCOL=1 MNEMA_DESKTOP_NO_UPDATE_CHECK=1 "$exe" >"$log" 2>&1 &
          pid=$!
          ready=0
          for _ in $(seq 1 60); do
            sleep 0.5
            kill -0 "$pid" 2>/dev/null || { cat "$log"; echo '::error::the app exited'; exit 1; }
            if grep -qF 'main mnema://localhost/ -> 200' "$log"; then ready=1; break; fi
          done
          kill "$pid" 2>/dev/null || true
          [ "$ready" = 1 ] || { cat "$log"; echo '::error::the app served no start page'; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mnema-desktop-macos
          path: ${{ runner.temp }}/macos/
          if-no-files-found: error
          retention-days: 1

  # The Linux client (Electron, linux/): built and tested on x86_64 and arm64
  # runners without any secret, then signed for the updater below.
  linux:
    needs: verify-tag
    uses: ./.github/workflows/desktop-linux.yml
    with:
      ref: ${{ github.sha }}
      tag: ${{ github.ref_name }}

  linux-sign:
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The signing key exists only in this protected environment (tags v*).
    environment: desktop-updater-signing
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mnema-desktop-linux-*
          merge-multiple: true
          path: linux-release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      # Dependencies are installed before the key is in the environment, and
      # without install scripts.
      - name: Install the pinned Tauri CLI
        working-directory: ui
        run: npm ci --ignore-scripts --no-audit --no-fund
      # The AppImages and .debs are the tested ones; they are only signed here,
      # with the version bound into the signature, exactly as the other platforms.
      - name: Sign the AppImages and .debs for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          shopt -s nullglob
          images=(linux-release/*.AppImage)
          [ "${#images[@]}" = 2 ] || { echo "::error::expected two AppImages, found ${#images[@]}"; exit 1; }
          for image in "${images[@]}"; do
            node ui/node_modules/@tauri-apps/cli/tauri.js signer sign --app-version "$version" "$image"
            [ -f "$image.sig" ] || { echo "::error::$image was not signed"; exit 1; }
          done
          debs=(linux-release/*.deb)
          [ "${#debs[@]}" = 2 ] || { echo "::error::expected two .deb files, found ${#debs[@]}"; exit 1; }
          for deb in "${debs[@]}"; do
            node ui/node_modules/@tauri-apps/cli/tauri.js signer sign --app-version "$version" "$deb"
            [ -f "$deb.sig" ] || { echo "::error::$deb was not signed"; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mnema-desktop-linux-signed
          path: linux-release/
          if-no-files-found: error
          retention-days: 1

  # Publishing is all or nothing. If the Linux client fails, say so plainly:
  # `publish` is then skipped and the release stays unpublished.
  linux-failed:
    needs: [linux, linux-sign]
    if: ${{ always() && (needs.linux.result != 'success' || needs.linux-sign.result != 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Say what failed
        env:
          BUILD: ${{ needs.linux.result }}
          SIGN: ${{ needs.linux-sign.result }}
        run: |
          echo "::error::The Linux client did not build, test or sign (build: $BUILD, signing: $SIGN). Nothing was published for any platform; fix the Linux job and run the release again."
          exit 1

  publish:
    needs: [build, installer, macos-app, linux-sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mnema-desktop-installer
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mnema-desktop-macos
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mnema-desktop-linux-signed
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mnema-desktop-windows-DEV-UNSIGNED-${{ needs.build.outputs.revision }}
          path: portable
      - name: Publish the release (draft until complete)
        run: |
          set -euo pipefail
          version="${TAG#v}"
          installer="$(ls release/*-setup.exe)"
          macos="$(ls release/*.app.tar.gz)"
          linux_x64="$(ls release/*_x86_64.AppImage)"
          linux_arm64="$(ls release/*_arm64.AppImage)"
          deb_x64="$(ls release/*.deb | grep -E '_(amd64|x86_64|x64)\.deb$')"
          deb_arm64="$(ls release/*.deb | grep -E '_(arm64|aarch64)\.deb$')"
          node scripts/update-manifest.mjs --version "$version" --repo "$GITHUB_REPOSITORY" \
            --installer "$installer" --sig "$installer.sig" --mac "$macos" --mac-sig "$macos.sig" \
            --linux-x86_64 "$linux_x64" --linux-x86_64-sig "$linux_x64.sig" \
            --linux-aarch64 "$linux_arm64" --linux-aarch64-sig "$linux_arm64.sig" \
            --linux-x86_64-deb "$deb_x64" --linux-x86_64-deb-sig "$deb_x64.sig" \
            --linux-aarch64-deb "$deb_arm64" --linux-aarch64-deb-sig "$deb_arm64.sig" --out release/latest.json
          # Every platform of the feed must verify against the key pinned in the app.
          node scripts/verify-updater-signatures.mjs release/latest.json release windows-x86_64 darwin-aarch64 linux-x86_64 linux-aarch64 linux-x86_64-deb linux-aarch64-deb
          (cd portable && zip -qr "../release/Mnema-Desktop-DEV-${TAG}-windows-x64-portable.zip" .)
          (cd release && sha256sum -- *.exe *.zip *.dmg *.app.tar.gz *.AppImage *.deb > SHA256SUMS)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Mnema Desktop $TAG" \
            --notes "Windows installer, macOS app for Apple silicon (M1 or newer) and Linux AppImages (x86_64, arm64) with automatic updates, and a .deb for Debian and Ubuntu that updates itself through the package manager (asks for your password). Installed clients update themselves; the signature is checked against a key built into the app. The macOS app is not notarized: see the README for the first start. The portable ZIP is unsigned and does not update itself." \
            release/*.exe release/*.exe.sig release/*.zip release/*.dmg release/*.app.tar.gz release/*.app.tar.gz.sig \
            release/*.AppImage release/*.AppImage.sig release/*.deb release/*.deb.sig release/latest.json release/SHA256SUMS
          # Clients look at latest/download/latest.json: published last.
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
