name: Mobile spike

# The Android and iOS host of doc/mobile.md, a spike: a debug APK and an
# unsigned iOS simulator build as artifacts, and a self-test of each in an
# emulator or simulator against the stand-in server. Not a required check.
# Nothing here signs with a real identity: the APK carries the Android debug
# key that the Gradle build generates in this run, and the iOS build is for
# the simulator with code signing off.

on:
  workflow_dispatch:
  push:
    branches: ['feat/mobile-**']
    paths:
      - mobile/**
      - experimental/app/src/**
      - experimental/app/page-shim/**
      - scripts/fake-instance.mjs
      - scripts/stage-web-bundle.sh
      - .github/workflows/mobile.yml
  pull_request:
    paths:
      - mobile/**
      - .github/workflows/mobile.yml

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_VERSION: 1.99.1
  # Android SDK packages, pinned. The NDK is r28c.
  ANDROID_PLATFORM: android-36
  ANDROID_BUILD_TOOLS: 36.0.0
  ANDROID_NDK_VERSION: 28.2.13676358
  # The self-test build opens this address on its own (mobile/src/selftest.rs).
  MNEMA_SELFTEST_SERVER: http://127.0.0.1:8765

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/mobile/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install pinned Rust toolchain with the Android targets
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
          rustup target add --toolchain "$RUST_VERSION" aarch64-linux-android x86_64-linux-android
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: mobile -> target
          key: android-${{ hashFiles('mobile/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feat/mobile') }}
      - name: Install pinned Android SDK packages
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" "ndk;$ANDROID_NDK_VERSION" platform-tools > /dev/null
          ndk="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          test -d "$ndk"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - name: Install the pinned Tauri CLI
        run: npm ci --prefix ui --ignore-scripts --no-audit --no-fund
      - name: Stage the signed web bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_DIR: mobile/bundle
        run: bash scripts/stage-web-bundle.sh
      - name: Format and lint for Android
        working-directory: mobile
        run: |
          set -euo pipefail
          cargo fmt --check
          llvm="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$llvm/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$llvm/llvm-ar"
          for features in "" "--features mobile-selftest"; do
            # shellcheck disable=SC2086
            cargo clippy --locked --target aarch64-linux-android $features -- -D warnings
          done
      - name: Generate the Android project where it is not committed yet
        working-directory: mobile
        run: |
          set -euo pipefail
          if [ ! -d gen/android ]; then
            node ../ui/node_modules/@tauri-apps/cli/tauri.js android init --ci --skip-targets-install
            echo 'apply(from = "../../../scripts/android-verifier.gradle.kts")' >> gen/android/app/build.gradle.kts
          fi
          echo "--- gen/android/app/build.gradle.kts"; cat gen/android/app/build.gradle.kts
          echo "--- gen/android/build.gradle.kts"; cat gen/android/build.gradle.kts
          echo "--- gen/android/settings.gradle"; cat gen/android/settings.gradle* || true
      - name: Upload the generated Android project
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-project
          path: |
            mobile/gen/android
            !mobile/gen/android/**/build/**
            !mobile/gen/android/.gradle/**
          include-hidden-files: true
          retention-days: 14
      - name: Build the debug APK (aarch64 and x86_64)
        working-directory: mobile
        run: |
          set -euo pipefail
          node ../ui/node_modules/@tauri-apps/cli/tauri.js android build --ci --debug --apk --target aarch64 x86_64
          mkdir -p ../out/android
          find gen/android/app/build/outputs/apk -name '*.apk' -print -exec cp {} ../out/android/mnema-talk-preview-debug.apk \;
      - name: Build the self-test APK (x86_64, for the emulator)
        working-directory: mobile
        run: |
          set -euo pipefail
          node ../ui/node_modules/@tauri-apps/cli/tauri.js android build --ci --debug --apk --target x86_64 --features mobile-selftest
          find gen/android/app/build/outputs/apk -name '*.apk' -print -exec cp {} ../out/android/mnema-talk-preview-selftest.apk \;
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-apk
          path: out/android/mnema-talk-preview-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-selftest-apk
          path: out/android/mnema-talk-preview-selftest.apk
          if-no-files-found: error
          retention-days: 14

  android-selftest:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-selftest-apk
          path: out
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # No camera, no microphone, no audio: the self-test needs none of them.
      - name: Run the app in an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash mobile/scripts/android-selftest.sh out/mnema-talk-preview-selftest.apk out/selftest
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-selftest-result
          path: out/selftest
          retention-days: 14

  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/mobile/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install pinned Rust toolchain with the iOS targets
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
          rustup target add --toolchain "$RUST_VERSION" aarch64-apple-ios aarch64-apple-ios-sim
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: mobile -> target
          key: ios-${{ hashFiles('mobile/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feat/mobile') }}
      - name: Install the pinned Tauri CLI
        run: npm ci --prefix ui --ignore-scripts --no-audit --no-fund
      - name: Stage the signed web bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_DIR: mobile/bundle
        run: bash scripts/stage-web-bundle.sh
      - name: Lint for iOS
        working-directory: mobile
        run: |
          set -euo pipefail
          xcodebuild -version
          for features in "" "--features mobile-selftest"; do
            # shellcheck disable=SC2086
            cargo clippy --locked --target aarch64-apple-ios-sim $features -- -D warnings
          done
      - name: Generate the Xcode project where it is not committed yet
        working-directory: mobile
        run: |
          set -euo pipefail
          if [ ! -d gen/apple ]; then
            node ../ui/node_modules/@tauri-apps/cli/tauri.js ios init --ci --skip-targets-install
          fi
          ls -la gen/apple
      - name: Upload the generated Xcode project
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-project
          path: |
            mobile/gen/apple
            !mobile/gen/apple/build/**
          include-hidden-files: true
          retention-days: 14
      - name: Build for the simulator (unsigned)
        working-directory: mobile
        run: |
          set -euo pipefail
          node ../ui/node_modules/@tauri-apps/cli/tauri.js ios build --ci --debug --target aarch64-sim --no-sign
          mkdir -p ../out/ios
          app="$(find gen/apple/build -name '*.app' -type d -path '*sim*' | head -n 1)"
          [ -n "$app" ] || app="$(find gen/apple/build -name '*.app' -type d | head -n 1)"
          echo "Built $app"
          ditto -c -k --keepParent "$app" ../out/ios/mnema-talk-preview-simulator.zip
      - name: Build the self-test app for the simulator
        working-directory: mobile
        run: |
          set -euo pipefail
          node ../ui/node_modules/@tauri-apps/cli/tauri.js ios build --ci --debug --target aarch64-sim --no-sign --features mobile-selftest
          app="$(find gen/apple/build -name '*.app' -type d -path '*sim*' | head -n 1)"
          [ -n "$app" ] || app="$(find gen/apple/build -name '*.app' -type d | head -n 1)"
          rm -rf ../out/ios/selftest && mkdir -p ../out/ios/selftest
          cp -R "$app" ../out/ios/selftest/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-app
          path: out/ios/mnema-talk-preview-simulator.zip
          if-no-files-found: error
          retention-days: 14
      - name: Run the self-test in a simulator
        run: bash mobile/scripts/ios-selftest.sh "$(find out/ios/selftest -maxdepth 1 -name '*.app' | head -n 1)" out/ios/result
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-selftest-result
          path: out/ios/result
          retention-days: 14
