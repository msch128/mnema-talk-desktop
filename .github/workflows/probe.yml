name: Desktop probe

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

env:
  CARGO_AUDIT_VERSION: 0.22.2
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the upstream checksums.txt
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: gitleaks
        run: |
          set -euo pipefail
          node scripts/check-native-test-vectors.mjs
          "$RUNNER_TEMP/gitleaks" dir --no-banner --redact --exit-code 1 --config .gitleaks.toml .
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 1 --config .gitleaks.toml .

  # -- Unsigned development probe; does not qualify gaming or E2EE -----------
  desktop-glib:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
      - name: Verify reviewed backport against optimized real Linux GLib
        run: bash scripts/test-glib-linux.sh

  desktop-probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: msch128/mnema-talk
          ref: main
          path: mnema-talk
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Frontend dependencies, tests and local-asset build
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix ui --no-audit --no-fund
          npm --prefix ui run check
          npm audit --prefix ui --omit=dev --audit-level=high
      - name: Rust format, tests and native checks
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checked-glib.mjs
          cargo +1.99.0 fmt --manifest-path Cargo.toml --check
          cargo +1.99.0 test --locked --manifest-path Cargo.toml
          cargo +1.99.0 clippy --locked --manifest-path Cargo.toml --all-targets --features shell -- -D warnings
      - name: Build unsigned feasibility probe (not a release)
        run: npm run build
      - name: Verify distribution notices and development manifest tests
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/*.test.mjs
          node scripts/collect-licenses.mjs --check
          node scripts/artifact-manifest.mjs target/release/mnema-desktop-probe.exe target/release/development-manifest.json x86_64-pc-windows-msvc
      - name: Rust advisory scan (pinned tool; no advisory ignores)
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.99.0 install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
          node scripts/checked-glib.mjs --audit
          cargo audit --file Cargo.lock
      - name: Upload Windows probe for qualification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-desktop-feasibility-probe
          path: |
            target/release/mnema-desktop-probe.exe
            target/release/development-manifest.json
            README.md
            THIRD_PARTY_NOTICES.md
            licenses/
            LICENSE
          if-no-files-found: error
          retention-days: 7

