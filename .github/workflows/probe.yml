name: Desktop probe

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-probe-${{ github.ref }}
  # Superseded pull request runs are cancelled; push, tag and manual runs never are.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_DENY_VERSION: 0.20.2
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the upstream checksums.txt
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  # Pull requests that touch only documentation skip the native builds below.
  # Nothing here is a required status check, and the secret scan always runs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then echo native=true >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          if printf '%s\n' "$files" | grep -qvE '(\.md$|^doc/|^docs/|^LICENSE)'; then
            echo native=true >> "$GITHUB_OUTPUT"
          else
            echo native=false >> "$GITHUB_OUTPUT"
          fi

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: gitleaks
        run: |
          set -euo pipefail
          node scripts/check-native-test-vectors.mjs
          "$RUNNER_TEMP/gitleaks" dir --no-banner --redact --exit-code 1 --config .gitleaks.toml .
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 1 --config .gitleaks.toml .

  # -- Unsigned development probe; does not qualify gaming or E2EE -----------
  # The published Linux client is Electron and does not use GLib. This job
  # checks the Tauri host's Linux GLib backport. That host stays off until
  # Tauri moves to GTK4. Remove `if: ${{ false }}` only together with that move.
  desktop-glib:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Verify reviewed backport against optimized real Linux GLib
        run: bash scripts/test-glib-linux.sh

  # The platform-neutral gaming logic (foreground tracking, game matching, input
  # state machines) runs on every system the clients ship for, not only Windows.
  gaming-logic:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy
      # Restored on pull requests, saved only on main.
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          key: ${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The probe's Linux-only dev-dependency (GLib test) links the system GLib.
      - name: Install GLib development files
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-dev
      - name: Test and lint the neutral gaming logic
        run: |
          set -euo pipefail
          cargo +1.99.1 test --locked --manifest-path Cargo.toml --lib
          cargo +1.99.1 clippy --locked --manifest-path Cargo.toml --lib --tests -- -D warnings

  desktop-probe:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: msch128/mnema-talk
          ref: main
          path: mnema-talk
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      # Restored on pull requests, saved only on main.
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          key: ${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Frontend dependencies, tests and local-asset build
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix ui --no-audit --no-fund
          node scripts/ensure-npm-optional.mjs ui
          npm --prefix ui run check
          npm audit --prefix ui --omit=dev --audit-level=high
      - name: Rust format, tests and native checks
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checked-glib.mjs
          cargo +1.99.1 fmt --manifest-path Cargo.toml --check
          cargo +1.99.1 test --locked --manifest-path Cargo.toml
          cargo +1.99.1 clippy --locked --manifest-path Cargo.toml --all-targets --features shell -- -D warnings
      - name: Build unsigned feasibility probe (not a release)
        run: npm run build
      - name: Verify distribution notices and development manifest tests
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/*.test.mjs
          node scripts/collect-licenses.mjs --check
          node scripts/artifact-manifest.mjs target/release/mnema-desktop-probe.exe target/release/development-manifest.json x86_64-pc-windows-msvc
      # Scoped to the Windows target (deny.toml); one documented exception, see
      # doc/security-review-1.2.md.
      - name: Rust advisory scan (pinned tool, Windows graph)
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.99.1 install cargo-deny --version "$CARGO_DENY_VERSION" --locked
          node scripts/checked-glib.mjs
          bash scripts/deny-all.sh
      - name: Upload Windows probe for qualification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-desktop-feasibility-probe
          path: |
            target/release/mnema-desktop-probe.exe
            target/release/development-manifest.json
            README.md
            THIRD_PARTY_NOTICES.md
            licenses/
            LICENSE
          if-no-files-found: error
          retention-days: 7

