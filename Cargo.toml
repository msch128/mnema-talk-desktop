[package]
name = "mnema-desktop-gaming-logic"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
description = "The gaming logic the desktop host includes by path; built here on its own so its tests run without the shell"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_System_Registry", "Win32_UI_Input", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop"] }
