<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share your screen</title>
<link rel="stylesheet" href="picker.css">
</head>
<body>
<main>
  <header>
    <span class="mark" aria-hidden="true"></span>
    <h1 id="title"></h1>
  </header>
  <p id="detail" class="detail"></p>
  <div id="sources" class="sources" role="listbox"></div>
  <div class="actions">
    <button id="share" class="primary" type="button" disabled></button>
    <button id="cancel" type="button"></button>
  </div>
</main>
<script src="picker.js"></script>
</body>
</html>
