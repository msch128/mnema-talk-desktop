# Advisory policy for every Rust lockfile of this repository (see
# doc/security-review-1.2.md). Run per manifest:
#   cargo deny --manifest-path <dir>/Cargo.toml check advisories
#
# The graph is scoped to the Windows target, the only platform shipped while the
# macOS and Linux clients are paused. That is what keeps the Linux-only GTK3
# crates (gtk, glib 0.18, proc-macro-error) out of the check: they are not in
# the Windows build (`cargo tree -i gtk --target x86_64-pc-windows-msvc` finds
# nothing), so no advisory about them is ignored. Resuming Linux for the Tauri
# host means adding the Linux target here AND moving to Tauri's GTK4 stack.
[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true
# Test-only crates are not shipped.
exclude-dev = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = [
  { id = "RUSTSEC-2026-0173", reason = "Accepted by the lead 2026-10-25; re-check by 2027-01-25 and drop this entry once hpke-rs / core-models move to hax-lib >= 0.4 (hax-lib-macros 0.4.2 no longer uses it). The crate appears only in the experimental native-crypto locks. proc-macro-error2 is a compile-time proc-macro helper of hax-lib-macros 0.3.7, pulled in by hpke-rs 0.8.0 (latest) -> libcrux-sha3 0.0.11 -> core-models 0.0.7 -> hax-lib ^0.3.7. It is only in the experimental native-crypto crates (not part of the shipped installer: tauri bundle uses shell,web-client,custom-protocol) and holds no runtime code. hax-lib-macros 0.4.2 already drops it, but core-models 0.0.7 still requires hax-lib ^0.3.7, so it cannot be upgraded here. Re-check when hpke-rs or core-models releases." },
]
